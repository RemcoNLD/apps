# Fetches planned road closures (NL: NDW, DE: Autobahn GmbH) into data/closures.json for EVailability.
# Wakes every 6 hours; tools/build-closures.py skips unless the interval set on the admin page
# (6, 12, 24 or 48 h, read from the Worker) has passed. "Run workflow" or a change to the script always updates.
name: Road closures
on:
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["tools/build-closures.py", ".github/workflows/closures.yml"]
permissions:
  contents: write
concurrency:
  group: closures
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # a queued run must start from the newest main, not the commit it was triggered on
      - name: Fetch and filter closures
        env:
          FORCE: ${{ github.event_name != 'schedule' }}
        run: python3 tools/build-closures.py
      - name: Commit if changed
        run: |
          git add data/closures.json data/closures-local.json data/closures-probe 2>/dev/null || true
          if git diff --cached --quiet; then echo "Nothing changed"; exit 0; fi
          git config user.name "closures-bot"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "Road closures update"
          # Our files were just built, so on a clash with another run's closures commit keep ours (-X theirs = the commit being replayed).
          for i in 1 2 3; do
            if ! git pull --rebase -X theirs -q; then
              # Last resort: put our freshly built files on top of the newest main.
              git rebase --abort 2>/dev/null || true
              rm -rf /tmp/cl && mkdir /tmp/cl && cp -r data/closures.json data/closures-local.json data/closures-probe /tmp/cl/ 2>/dev/null || true
              git fetch -q origin main && git reset -q --hard origin/main
              cp -r /tmp/cl/* data/ && git add data/closures.json data/closures-local.json data/closures-probe 2>/dev/null || true
              git diff --cached --quiet && exit 0
              git commit -q -m "Road closures update"
            fi
            git push -q && exit 0; sleep 5
          done
          exit 1
