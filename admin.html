<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="app-version" content="2026-11-16.1"><!-- shown on the apps page; raise with each change -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Usage · EVailability</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📊</text></svg>">
<style>
  :root {
    --bg: #1d2429; --card: #263038; --text: #f3f1ea; --muted: #93a0a8; --line: #3a464f;
    --ok: #43b96d; --warn: #f0a43a; --bad: #e0574f; --blue: #2f63b8; color-scheme: dark;
  }
  @media (prefers-color-scheme: light) {
    :root { --bg: #eef1f3; --card: #fff; --text: #1b2328; --muted: #5c6970; --line: #dde3e7;
      --ok: #23914b; --warn: #c47a12; --bad: #c43d35; --blue: #1f55ad; color-scheme: light; }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html { background: var(--bg); }
  body {
    margin: 0 auto; max-width: 720px; color: var(--text); background: var(--bg);
    font: 16px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
    padding: calc(env(safe-area-inset-top, 0px) + 18px) 16px calc(env(safe-area-inset-bottom, 0px) + 28px);
  }
  .apps-back { display: inline-block; margin: 0 0 10px; font-weight: 700; text-decoration: none; color: inherit; opacity: .65; }
  .apps-back:active { opacity: 1; }
  h1 { font-size: 1.6rem; margin: 0 0 4px; }
  h2 { font-size: 1.15rem; margin: 26px 0 10px; }
  .muted { color: var(--muted); }
  .login { display: flex; gap: 8px; margin: 14px 0; }
  input {
    flex: 1; min-width: 0; padding: 12px; font: inherit; color: var(--text);
    background: var(--card); border: 1px solid var(--line); border-radius: 10px;
  }
  button {
    padding: 12px 16px; font: inherit; font-weight: 700; color: #fff;
    background: var(--blue); border: 0; border-radius: 10px; cursor: pointer;
  }
  .remember { display: flex; align-items: center; gap: 8px; margin: -4px 0 14px; color: var(--muted); }
  .remember input { width: 20px; height: 20px; flex: none; }
  .session { display: flex; gap: 18px; margin: 12px 0 4px; }
  .link { padding: 0; background: none; color: var(--blue); font-weight: 600; text-decoration: underline; }
  .card { background: var(--card); border-radius: 12px; padding: 14px 16px; margin-bottom: 10px; }
  .group h3 { margin: 0 0 8px; font-size: .95rem; letter-spacing: .02em; text-transform: uppercase; color: var(--muted, #93a0a8); }
  .group .line { padding: 8px 0; }
  .group .line + .line { border-top: 1px solid rgba(127,127,127,.18); }
  .group > .small.muted:last-child { margin-top: 6px; }
  .row { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
  .name { font-weight: 700; }
  .num { font-variant-numeric: tabular-nums; font-weight: 700; white-space: nowrap; }
  .bar { height: 10px; border-radius: 6px; background: var(--line); margin: 8px 0 6px; overflow: hidden; }
  .bar > span { display: block; height: 100%; border-radius: 6px; background: var(--ok); }
  .bar > span.warn { background: var(--warn); }
  .bar > span.bad { background: var(--bad); }
  .small { font-size: .9rem; }
  .note { border-left: 4px solid var(--warn); }
  .error { color: var(--bad); }
  /* Last 7 days: a row per source with today's number and the week as bars */
  .week { padding: 4px 16px; }
  .wk { display: flex; align-items: center; gap: 14px; padding: 12px 0; }
  .wk + .wk { border-top: 1px solid rgba(127,127,127,.18); }
  .wk-l { flex: 1; min-width: 0; }
  .wk-l .name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .wk-r { text-align: right; flex: none; min-width: 5.5em; }
  .wk-r .num { font-size: 1.9rem; line-height: 1.1; }
  .spark { position: relative; display: flex; align-items: flex-end; gap: 4px; height: 34px; margin-top: 8px; max-width: 230px; }
  .spark .col { flex: 1; height: 100%; display: flex; align-items: flex-end; }
  .spark span { width: 100%; background: var(--muted); opacity: .45; border-radius: 3px 3px 1px 1px; }
  .spark span.today { background: var(--ok); opacity: 1; }
  .spark span.near { background: var(--warn); opacity: 1; }
  .spark span.over { background: var(--bad); opacity: 1; }
  .spark span.zero { opacity: .2; }
  .spark span.none { height: 3%; background: transparent; border-bottom: 2px dotted var(--muted); opacity: .5; border-radius: 0; }
  .spark { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; cursor: pointer; }
  .spark span.sel { outline: 2px solid var(--text); outline-offset: 1px; }
  .wk-tip { margin-top: 5px; }
  .spark .lim { position: absolute; left: -3px; right: -3px; bottom: 100%; height: 0; border-top: 2px solid var(--bad);
    transition: bottom 1.6s ease-out; pointer-events: none; }
  .table-wrap { overflow-x: auto; background: var(--card); border-radius: 12px; }
  table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
  th, td { padding: 9px 12px; text-align: right; white-space: nowrap; border-bottom: 1px solid var(--line); }
  th:first-child, td:first-child { text-align: left; position: sticky; left: 0; background: var(--card); }
  thead th { color: var(--muted); font-weight: 600; font-size: .9rem; }
  tr:last-child td { border-bottom: 0; }
  /* Settings */
  .set { padding: 7px 0; }
  .set-name { flex: 1; min-width: 0; text-align: left; font: inherit; font-weight: 700; color: inherit; background: none; border: 0; padding: 4px 0; cursor: pointer; line-height: 1.25; }
  .set-name .info { display: inline-flex; align-items: center; justify-content: center; width: 1.15em; height: 1.15em; margin-left: 7px;
    border: 1.5px solid var(--muted); border-radius: 50%; color: var(--muted); font-size: .75em; font-style: italic; font-family: Georgia, serif; vertical-align: 1px; }
  .set-name[aria-expanded="true"] .info { background: var(--muted); color: var(--card); }
  .set-name .dot { display: inline-block; width: 8px; height: 8px; margin-left: 7px; border-radius: 50%; background: var(--warn); vertical-align: 2px; }
  .set + .set { border-top: 1px solid rgba(127,127,127,.18); }
  .set .row { align-items: center; }
  .set select { flex: none; width: 6.5em; padding: 8px 10px; font: inherit; color: inherit; background: transparent; border: 1px solid currentColor; border-radius: 8px; }
  .set input[type=number], .set input[type=text] { flex: none; width: 6.5em; padding: 7px 10px; }
  .set .meta { margin-top: 4px; }
  .set .changed { color: var(--warn); font-weight: 600; }
  .switch { position: relative; width: 52px; height: 30px; flex: none; }
  .switch input { position: absolute; opacity: 0; width: 100%; height: 100%; margin: 0; cursor: pointer; z-index: 1; }
  .switch span { position: absolute; inset: 0; border-radius: 15px; background: var(--line); transition: background .15s; }
  .switch span::after { content: ""; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%; background: #fff; transition: transform .15s; }
  .switch input:checked + span { background: var(--ok); }
  .switch input:checked + span::after { transform: translateX(22px); }
  .switch input:focus-visible + span { outline: 2px solid var(--blue); outline-offset: 2px; }
  #setMsg { min-height: 1.2em; }
  /* Debug route viewer */
  #routeView details { background: var(--card); border-radius: 12px; padding: 10px 14px; margin-bottom: 10px; }
  #routeView summary { font-weight: 700; cursor: pointer; padding: 4px 0; }
  #routeView .table-wrap { margin-top: 8px; max-height: 70vh; overflow: auto; }
  #routeView td, #routeView th { padding: 6px 10px; font-size: .88rem; text-align: left; }
  #routeView td.n, #routeView th.n { text-align: right; }
  #routeView td.wrap { white-space: normal; min-width: 14em; }
  #routeView pre { margin: 8px 0 0; max-height: 70vh; overflow: auto; font: .78rem/1.35 ui-monospace, Menlo, monospace; white-space: pre; }
  #routeView .kv { display: grid; grid-template-columns: max-content 1fr; gap: 4px 14px; margin-top: 6px; font-size: .92rem; }
  #routeView .kv > :nth-child(odd) { color: var(--muted); }
  #routeView .hl { color: var(--warn); font-weight: 700; }
</style>
</head>
<body>
<a class="apps-back" href="./">‹ Apps</a>
<h1>Usage</h1>
<p class="muted">How much of the free tiers EVailability uses, per data source, and the app’s server settings.</p>

<form id="login">
  <div class="login">
    <input id="pw" type="password" placeholder="Admin password" autocomplete="current-password" aria-label="Admin password">
    <button type="submit">Show</button>
  </div>
  <label class="remember"><input id="remember" type="checkbox" checked> Remember me on this device</label>
</form>
<div class="session" id="session" hidden>
  <button type="button" class="link" id="refresh">Refresh</button>
  <button type="button" class="link" id="logout">Log out</button>
</div>
<p id="msg" class="error" hidden></p>
<div id="settings"></div>
<div id="debugRoute" hidden>
  <h2>Debug routes</h2>
  <div class="card group">
    <div class="row"><input id="routeId" type="text" placeholder="Route id, e.g. k3x9q2" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="Route id" style="flex:1"></div>
    <div class="session">
      <button type="button" class="link" id="routeShow">Show</button>
      <button type="button" class="link" data-part="">Download</button>
    </div>
    <div class="small muted" id="routeMsg">Routes planned in debug mode (Help &gt; Debug line) are kept 30 days. The id is after # on the app’s debug line.</div>
  </div>
</div>
<div id="routeView"></div>
<div id="out"></div>

<script>
const WORKER = "https://ionity.remco-dv.workers.dev"; // old Worker name until its secrets are moved
const KEY = "evailability-admin-token";
try { const old = localStorage.getItem("ionity-admin-token"); if (old && !localStorage.getItem(KEY)) localStorage.setItem(KEY, old); localStorage.removeItem("ionity-admin-token"); } catch (_) {}

// Free-tier limits we know for sources that don't report them (per day).
// OpenRouteService reports its own limits, so those come live from the Worker.
const KNOWN_LIMITS = {
  "Worker requests": { limit: 100000, note: "Cloudflare Workers free plan" },
  "KV reads": { limit: 100000, note: "Cloudflare KV free plan" },
  "KV writes": { limit: 1000, note: "Cloudflare KV free plan" },
};
const LABELS = {
  "Routing": "OpenRouteService routes", "Matrix": "OpenRouteService detours", "Geocoder": "Place search & names",
  "Open Charge Map": "Open Charge Map", "NDW": "NDW (Netherlands live)", "E-Control": "E-Control (Austria live)",
  "MobiData BW": "MobiData BW (Germany live)", "Nominatim": "Nominatim (backup search)",
  "PAN FR": "transport.data.gouv.fr (France live)", "PAN FR index": "France index (GitHub Pages)",
  "Worker requests": "Worker requests", "KV reads": "KV reads", "KV writes": "KV writes", "Logo fetch": "Brand logos",
};
const ORS_LABELS = { directions: "Routes", matrix: "Detours (matrix)", "geocode/search": "Place search", "geocode/reverse": "Place names" };

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const fmt = (n) => Number(n).toLocaleString("en-GB");

function bar(used, limit) {
  const pct = limit ? Math.min(100, (used / limit) * 100) : 0;
  const cls = pct >= 90 ? "bad" : pct >= 70 ? "warn" : "";
  return `<div class="bar"><span class="${cls}" style="width:${pct.toFixed(1)}%"></span></div>`;
}
function resetText(reset) {
  if (!reset) return "";
  const ms = reset > 1e12 ? reset : reset * 1000; // seconds or milliseconds
  const d = new Date(ms);
  if (isNaN(d)) return "";
  return `resets ${d.toLocaleString("en-GB", { weekday: "short", hour: "2-digit", minute: "2-digit" })}`;
}
function ago(iso) {
  const m = Math.round((Date.now() - new Date(iso)) / 60000);
  return m < 1 ? "just now" : m < 60 ? `${m} min ago` : `${Math.round(m / 60)} h ago`;
}

function render(d) {
  const todayRec = d.days.find((x) => x.day === d.today) || { calls: {}, ors: {} };
  // Today = saved + not yet saved.
  const calls = { ...todayRec.calls };
  for (const [k, n] of Object.entries(d.unsaved.calls || {})) calls[k] = (calls[k] || 0) + n;
  const ors = { ...todayRec.ors };
  for (const [k, v] of Object.entries(d.unsaved.ors || {})) if (!ors[k] || ors[k].at < v.at) ors[k] = v;

  let html = "";
  if (!d.stored) {
    html += `<div class="card note small">Counts aren't saved yet, so they reset whenever Cloudflare restarts the Worker.
      Add the KV namespace (binding <b>USAGE</b>) to keep them.</div>`;
  }

  // One block per provider, then one for the rest. Each line: what was counted today, and the
  // free limit where one is known (OpenRouteService reports its own; Cloudflare's are fixed).
  const used = new Set();
  const line = (k, label) => {
    used.add(k);
    const lim = KNOWN_LIMITS[k];
    const n = calls[k] || 0;
    return `<div class="line"><div class="row"><span class="name">${esc(label || LABELS[k] || k)}</span>
      <span class="num">${fmt(n)}${lim ? ` / ${fmt(lim.limit)}` : ""}</span></div>${lim ? bar(n, lim.limit) : ""}</div>`;
  };
  const group = (title, body, note = "") =>
    `<div class="card group"><h3>${esc(title)}</h3>${body}${note ? `<div class="small muted">${note}</div>` : ""}</div>`;

  html += `<h2>Today</h2>`;
  html += group("Cloudflare", ["Worker requests", "KV reads", "KV writes"].map((k) => line(k)).join(""),
    "Free plan. Over a limit, further calls of that kind fail until the reset at 00:00 UTC (01:00 Dutch time in winter, 02:00 in summer).");

  // OpenRouteService: its own quota per service, with the Worker's count of calls beside it.
  const orsRows = [["directions", "Routing"], ["matrix", "Matrix"], ["geocode/search", "Geocoder"], ["geocode/reverse", null]];
  let orsBody = "";
  for (const [svc, callKey] of orsRows) {
    const q = ors[svc];
    if (callKey) used.add(callKey);
    if (!q && !(callKey && calls[callKey])) continue;
    const u = q && q.limit != null && q.remaining != null ? q.limit - q.remaining : null;
    const counted = callKey && calls[callKey] != null ? `counted by the Worker: ${fmt(calls[callKey])}` : "";
    orsBody += `<div class="line"><div class="row"><span class="name">${esc(ORS_LABELS[svc])}</span>
      <span class="num">${u != null ? `${fmt(u)} / ${fmt(q.limit)}` : q?.remaining != null ? `${fmt(q.remaining)} left` : callKey ? fmt(calls[callKey]) : "?"}</span></div>
      ${u != null ? bar(u, q.limit) : ""}
      <div class="small muted">${[q ? resetText(q.reset) : "", q ? `as of ${ago(q.at)}` : "no quota reported yet", u != null ? counted : ""].filter(Boolean).join(" · ")}</div></div>`;
  }
  if (!orsBody) {
    const hdr = d.orsHeaders || {};
    orsBody = Object.keys(hdr).length
      ? `<div class="small muted">Answered, but without a recognised quota. What it sent:<br>${
          Object.keys(hdr).map((k) => `<b>${esc(ORS_LABELS[k] || k)}</b>: ${Object.keys(hdr[k].headers || {}).length
            ? Object.entries(hdr[k].headers).map(([h, v]) => `${esc(h)} = ${esc(v)}`).join(", ") : "no quota headers"}`).join("<br>")}</div>`
      : `<div class="small muted">Nothing yet today. The quota appears after the next route is planned.</div>`;
  }
  html += group("OpenRouteService", orsBody, "Limits as OpenRouteService reports them.");

  html += group("Open Charge Map", line("Open Charge Map", "Calls"), "No daily limit published; blocks bursts.");
  html += group("NDW (Netherlands live)", line("NDW", "Calls"), "Open data, no daily limit published.");
  html += group("MobiData BW (Germany live)", line("MobiData BW", "Calls"), "Open data, no daily limit published.");
  html += group("E-Control (Austria live)", line("E-Control", "Calls"), "No daily limit published.");
  html += group("transport.data.gouv.fr (France live)", line("PAN FR", "Whole-file reads") + line("PAN FR index", "Index loads"), "Open data. Each read is the whole country (~9.5 MB) and costs more CPU than the free plan allows per request.");

  // Everything else: brand logos, the backup place search, and anything counted that isn't listed above.
  const rest = ["Logo fetch", "Nominatim", ...Object.keys(calls)].filter((k, i, a) => a.indexOf(k) === i && !used.has(k) && calls[k] != null);
  if (rest.length) html += group("Other", rest.map((k) => line(k)).join(""), "No daily limits published.");

  if (d.days.length) {
    // Always 7 days, oldest left and today right; days before the first count are empty.
    const have = d.days.slice().reverse();
    const days = [];
    for (let i = 6; i >= 0; i--) {
      const day = new Date(Date.parse(`${d.today}T00:00:00Z`) - i * 864e5).toISOString().slice(0, 10);
      days.push(have.find((x) => x.day === day) || { day, calls: null });
    }
    days[6] = { ...days[6], calls }; // today including what isn't saved yet
    const keys = [...new Set(days.flatMap((x) => Object.keys(x.calls || {})))];
    // Daily limit per source where there is one: Cloudflare's fixed ones, and what OpenRouteService
    // reported most recently for its services.
    const orsLimit = (svc) => [...d.days, { ors }].map((x) => x.ors?.[svc]?.limit).filter((v) => v != null).pop();
    const limitOf = (k) => KNOWN_LIMITS[k]?.limit
      ?? { Routing: orsLimit("directions"), Matrix: orsLimit("matrix"), Geocoder: orsLimit("geocode/search") }[k] ?? null;
    const total = (k) => days.reduce((n, x) => n + (x.calls?.[k] || 0), 0);
    keys.sort((a, b) => total(b) - total(a));
    const dayName = (x) => new Date(`${x.day}T12:00:00Z`).toLocaleDateString("en-GB", { weekday: "short", day: "numeric" });
    html += `<h2>Last 7 days</h2><div class="card week">${keys.map((k) => {
      const vals = days.map((x) => (x.calls ? x.calls[k] || 0 : null));
      const lim = limitOf(k);
      // The scale is the limit, or the busiest day once that went over it: then the red line sits
      // lower, showing by how much.
      const top = Math.max(1, lim || 0, ...vals.map((v) => v || 0));
      const today = vals[6] || 0;
      const bars = vals.map((v, i) => {
        // Each day is a full-height column, so even a tiny bar is easy to tap.
        if (v == null) return `<b class="col" data-tip="${esc(dayName(days[i]))}: no count yet"><span class="none"></span></b>`;
        const cls = lim && v > lim ? "over" : lim && v >= 0.8 * lim ? "near" : i === 6 ? "today" : "";
        return `<b class="col" data-tip="${esc(dayName(days[i]))}: ${fmt(v)}${lim ? ` of ${fmt(lim)}` : ""}"><span class="${cls}${v ? "" : " zero"}" style="height:${v ? Math.max(6, (v / top) * 100).toFixed(1) : 3}%"></span></b>`;
      }).join("");
      const line = lim ? `<i class="lim" data-pos="${((lim / top) * 100).toFixed(1)}" title="Limit ${fmt(lim)} a day"></i>` : "";
      return `<div class="wk">
        <div class="wk-l"><div class="name">${esc(LABELS[k] || k)}</div><div class="spark">${bars}${line}</div><div class="wk-tip small muted" hidden></div></div>
        <div class="wk-r"><div class="num${lim && today > lim ? " error" : ""}">${today ? fmt(today) : "–"}</div>
          <div class="small muted">${fmt(total(k))}/w</div></div>
      </div>`;
    }).join("")}</div>
    <p class="small muted">Bars: one per day, ${esc(dayName(days[0]))} to today (green), each source on its own scale. A red line is the daily limit:
      a bar turns orange from 80% of it and red over it; then the scale grows and the line moves down. Tap a bar for its number.</p>`;
  }
  html += `<p class="small muted" style="margin-top:18px">Days run in UTC. Cloudflare can run several copies of the Worker;
    each saves its own count, so Worker and source counts are close, not exact. OpenRouteService figures come from ORS itself.</p>`;
  $("out").innerHTML = html;
  // Tapping a bar shows that day's number under the row's bars; tapping it again hides it.
  $("out").onclick = (e) => {
    const col = e.target.closest(".spark .col[data-tip]");
    if (!col) return;
    const bar = col.querySelector("span");
    const row = col.closest(".wk"), tip = row.querySelector(".wk-tip"), was = bar.classList.contains("sel");
    row.querySelectorAll(".spark span.sel").forEach((x) => x.classList.remove("sel"));
    if (was) { tip.hidden = true; return; }
    bar.classList.add("sel");
    tip.textContent = col.dataset.tip; tip.hidden = false;
  };
  // Limit lines slide down from the top to where they belong (lower = further over the limit).
  requestAnimationFrame(() => requestAnimationFrame(() =>
    document.querySelectorAll(".spark .lim").forEach((l) => { l.style.bottom = `${l.dataset.pos}%`; })));
}

function savedToken() {
  try { return localStorage.getItem(KEY) || sessionStorage.getItem(KEY) || ""; } catch (_) { return ""; }
}
function rememberToken(token) {
  try {
    localStorage.removeItem(KEY); sessionStorage.removeItem(KEY);
    // Remembered: kept on this device. Otherwise only until this tab is closed.
    ($("remember").checked ? localStorage : sessionStorage).setItem(KEY, token);
  } catch (_) {}
}
function showLoggedIn(on) {
  $("login").hidden = on;
  $("session").hidden = !on;
  $("debugRoute").hidden = !on;
}

async function load(token = $("pw").value.trim()) {
  if (!token) return;
  $("msg").hidden = true;
  $("out").innerHTML = `<p class="muted">Loading…</p>`;
  try {
    const res = await fetch(`${WORKER}/admin/usage`, { headers: { Authorization: `Bearer ${token}` } });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) {
      if (res.status === 401) { try { localStorage.removeItem(KEY); sessionStorage.removeItem(KEY); } catch (_) {} showLoggedIn(false); }
      throw new Error(data.error || `Error ${res.status}`);
    }
    if ($("pw").value.trim()) rememberToken(token);
    $("pw").value = "";
    showLoggedIn(true);
    render(data);
    loadSettings(token);
  } catch (e) {
    $("out").innerHTML = "";
    $("msg").textContent = e.message;
    $("msg").hidden = false;
  }
}

// ---- Settings: switches and values the Worker reads from KV (no need for the Cloudflare dashboard).
let settingsToken = "";
async function loadSettings(token) {
  settingsToken = token;
  try {
    const res = await fetch(`${WORKER}/admin/settings`, { headers: { Authorization: `Bearer ${token}` } });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.error || `Error ${res.status}`);
    renderSettings(data);
  } catch (e) {
    $("settings").innerHTML = `<div class="card small error">Settings couldn’t be loaded: ${esc(e.message)}</div>`;
  }
}
const showVal = (s, v) => (s.type === "bool" ? (v ? "on" : "off") : s.type === "choice" ? `${v} h`
  : v === "" || v == null ? "empty" : String(v));
function renderSettings(data, msg = "") {
  const rows = data.settings.map((s) => {
    let control;
    if (s.type === "bool") control = `<label class="switch"><input type="checkbox" data-key="${esc(s.key)}" ${s.value ? "checked" : ""} aria-label="${esc(s.label)}"><span></span></label>`;
    else if (s.type === "choice") control = `<select data-key="${esc(s.key)}" aria-label="${esc(s.label)}">${s.options.map((o) =>
      `<option value="${o}" ${Number(s.value) === o ? "selected" : ""}>${o} h</option>`).join("")}</select>`;
    else control = `<input type="${s.type === "number" ? "number" : "text"}" data-key="${esc(s.key)}" value="${esc(s.value ?? "")}"
      ${s.type === "number" ? `min="${s.min}" max="${s.max}" inputmode="numeric"` : ""} placeholder="${esc(showVal(s, s.default))}" aria-label="${esc(s.label)}">`;
    // Compact: name and control on one line; the explanation opens with the ⓘ button (or a tap on
    // the name). A changed setting shows an orange dot, and its reset link stays in view.
    return `<div class="set"><div class="row">
        <button type="button" class="set-name" data-info="${esc(s.key)}" aria-expanded="false">${esc(s.label)}${s.changed ? '<i class="dot" title="Changed"></i>' : ""}<span class="info" aria-hidden="true">i</span></button>${control}</div>
      ${s.changed ? `<div class="small"><span class="changed">Changed</span> · <button type="button" class="link" data-reset="${esc(s.key)}">Back to default (${esc(showVal(s, s.default))})</button></div>` : ""}
      <div class="small muted meta" id="info-${esc(s.key)}" hidden>${esc(s.help || "")} Default: ${esc(showVal(s, s.default))}.</div></div>`;
  }).join("");
  $("settings").innerHTML = `<h2>Settings</h2><div class="card group">${rows}
    <div class="small muted" id="setMsg">${esc(msg || data.note || "")}</div></div>
    <h2>Road closures</h2><div class="card small" id="closInfo">Loading…</div>`;
  loadClosuresInfo(Number(data.settings.find((x) => x.key === "closuresHours")?.value));
}
// Last run of the GitHub job that fetches planned road closures (data/closures.json on this site).
async function loadClosuresInfo(hours) {
  const run = `<a href="https://github.com/RemcoNLD/apps/actions/workflows/closures.yml" target="_blank" rel="noopener">Run workflow on GitHub</a>`;
  try {
    const res = await fetch(`data/closures.json?t=${Date.now()}`, { cache: "no-store" });
    if (!res.ok) throw new Error(res.status === 404 ? "No update has run yet." : `Error ${res.status}`);
    const d = await res.json();
    const when = new Date(d.generatedAt);
    const ago = Math.round((Date.now() - when) / 36e5);
    const src = Object.entries(d.sources || {}).map(([k, v]) =>
      `${esc(k.toUpperCase())}: ${v.ok ? `${v.count} closures` : `<span class="error">failed (${esc(v.error || "?")})</span>`}`).join(" · ");
    const state = ago > (hours || d.hours || 12) + 8 ? `<b class="error">Late</b>: older than the interval allows. ` : "";
    $("closInfo").innerHTML = `${state}Last update ${esc(when.toLocaleString())} (${ago} h ago). ${src}<br>${run} to update now.`;
  } catch (e) {
    $("closInfo").innerHTML = `${esc(e.message)} ${run}`;
  }
}
async function saveSetting(key, value) {
  $("setMsg").textContent = "Saving…";
  try {
    const res = await fetch(`${WORKER}/admin/settings`, {
      method: "POST", headers: { Authorization: `Bearer ${settingsToken}`, "Content-Type": "application/json" },
      body: JSON.stringify({ settings: { [key]: value } }),
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.error || `Error ${res.status}`);
    renderSettings(data, `Saved. ${data.note || ""}`);
  } catch (e) {
    $("setMsg").textContent = `Not saved: ${e.message}`;
    $("setMsg").classList.add("error");
  }
}
$("settings").addEventListener("change", (e) => {
  const el = e.target.closest("[data-key]");
  if (!el) return;
  saveSetting(el.dataset.key, el.type === "checkbox" ? el.checked : el.value.trim());
});
$("settings").addEventListener("click", (e) => {
  const info = e.target.closest("[data-info]");
  if (info) {
    const box = $(`info-${info.dataset.info}`);
    if (box) { box.hidden = !box.hidden; info.setAttribute("aria-expanded", String(!box.hidden)); }
    return;
  }
  const b = e.target.closest("[data-reset]");
  if (b) saveSetting(b.dataset.reset, null);
});

// ---- Debug routes on screen: summary, the routing service's steps, road numbers, chargers and the raw JSON.
const TURN_NAME = { 0: "left", 1: "right", 2: "sharp left", 3: "sharp right", 4: "slight left", 5: "slight right", 6: "straight", 7: "roundabout", 8: "leave roundabout", 9: "U-turn", 10: "arrive", 11: "depart", 12: "keep left", 13: "keep right" };
// Long lists of coordinates and numbers shortened, so the raw JSON stays readable.
function shortJson(v) {
  return JSON.stringify(v, (k, x) => {
    if (Array.isArray(x) && x.length > 12 && x.every((y) => typeof y === "number" || (Array.isArray(y) && y.every((z) => typeof z === "number")))) {
      return `[${x.length} ${Array.isArray(x[0]) ? "points" : "numbers"}: ${JSON.stringify(x[0])} … ${JSON.stringify(x[x.length - 1])}]`;
    }
    return x;
  }, 2);
}
const ll = (p) => (Array.isArray(p) ? `${(+p[1]).toFixed(5)}, ${(+p[0]).toFixed(5)}` : "–");
const table = (head, rows) => `<div class="table-wrap"><table><thead><tr>${head.map(([h, c]) => `<th class="${c || ""}">${esc(h)}</th>`).join("")}</tr></thead><tbody>${rows.join("")}</tbody></table></div>`;
function renderRoute(rec, id) {
  const app = rec.app || {}, r = app.route || {}, req = rec.request || {};
  const f = rec.ors?.answer?.features?.[0];
  const segs = f?.properties?.segments || [];
  const km = r.km || [];
  // The routing service's own steps, with the km along the route from its distances.
  let acc = 0;
  const steps = segs.flatMap((sg) => sg.steps || []).map((st) => { const at = acc; acc += st.distance || 0; return { ...st, at: at / 1000 }; });
  const stepRows = steps.map((st) => `<tr><td class="n">${st.at.toFixed(1)}</td><td>${esc(TURN_NAME[st.type] ?? st.type)}${st.exit_number ? ` (exit ${st.exit_number})` : ""}</td><td>${esc(st.name && st.name !== "-" ? st.name : "")}</td><td class="wrap">${esc(st.instruction || "")}</td><td class="n">${((st.distance || 0) / 1000).toFixed(2)}</td></tr>`);
  const roadRows = (r.roads || []).map((x) => `<tr><td>${esc(x.ref)}</td><td>${esc(x.country || "")}</td><td class="n">${x.fromKm}</td><td class="n">${x.toKm}</td><td class="n">${(x.toKm - x.fromKm).toFixed(1)}</td></tr>`);
  const stRows = (app.stations || []).map((x) => `<tr><td class="n">${x.alongKm}</td><td>${esc(x.brand)}</td><td>${esc(x.name)}</td><td>${esc(x.country || "")}</td><td class="n">${x.offRouteKm}</td><td class="n">${x.maxKw ?? ""}</td><td>${x.status ? esc(`${x.status.available ?? "?"}/${x.status.total ?? "?"}`) : "–"}</td><td>${esc(x.road || "")}</td></tr>`);
  const sum = [
    ["Id", `#${id}`], ["Planned", new Date(rec.at).toLocaleString()], ["Worker", rec.worker],
    ["From", ll(req.from)], ["Via", (req.via || []).map(ll).join(" · ") || "–"], ["To", ll(req.to)],
    ["Distance", `${r.distanceKm} km`], ["Time", `${r.durationMin} min`], ["Brands", (app.brands || []).join(", ")],
    ["Roads", (r.roads || []).map((x) => x.ref).join(" › ") || "–"],
    ["Borders", (r.borders || []).map((b) => `${b.iso || b.id} ${b.fromKm}–${b.toKm}`).join(", ") || "–"],
    ["Chargers", (app.stations || []).length], ["Route points", `${(r.coords || []).length} (app) · ${f?.geometry?.coordinates?.length ?? "?"} (routing service)`],
  ].map(([k, v]) => `<span>${esc(k)}</span><span>${esc(String(v))}</span>`).join("");
  $("routeView").innerHTML = `<h2>Route #${esc(id)}</h2>
    <details open><summary>Summary</summary><div class="kv">${sum}</div></details>
    <details open><summary>Routing service steps (${steps.length})</summary>${steps.length ? table([["km", "n"], ["Type"], ["Name"], ["Instruction"], ["Length", "n"]], stepRows) : `<p class="small muted">${esc(rec.ors?.cached || "No raw answer kept.")}</p>`}</details>
    <details><summary>Road numbers the app got (${(r.roads || []).length})</summary>${table([["Road"], ["Country"], ["From", "n"], ["To", "n"], ["km", "n"]], roadRows)}</details>
    <details><summary>Chargers (${(app.stations || []).length})</summary>${table([["km", "n"], ["Brand"], ["Name"], ["Ctry"], ["Off", "n"], ["kW", "n"], ["Free"], ["Road"]], stRows)}</details>
    <details><summary>Request</summary><pre>${esc(JSON.stringify(req, null, 2))}</pre></details>
    <details><summary>Raw JSON (coordinate lists shortened)</summary><pre id="rawJson"></pre></details>`;
  // Built only when opened: the routing answer can be large.
  const raw = $("routeView").querySelector("details:last-child");
  raw.addEventListener("toggle", () => { if (raw.open && !$("rawJson").textContent) $("rawJson").textContent = shortJson(rec); }, { once: false });
  $("routeView").scrollIntoView({ behavior: "smooth", block: "start" });
}
$("routeShow").addEventListener("click", async () => {
  const id = $("routeId").value.trim().replace(/^#/, "").toLowerCase();
  const msg = $("routeMsg");
  msg.classList.remove("error");
  if (!id) { msg.textContent = "Enter a route id first."; return; }
  msg.textContent = "Fetching…";
  try {
    const res = await fetch(`${WORKER}/debug/route/${encodeURIComponent(id)}`, { headers: { "X-Access": savedToken() } });
    if (!res.ok) throw new Error((await res.json().catch(() => ({}))).error || `Error ${res.status}`);
    const rec = await res.json();
    msg.textContent = "";
    renderRoute(rec, id);
  } catch (err) {
    msg.textContent = err.message;
    msg.classList.add("error");
  }
});
$("routeId").addEventListener("keydown", (e) => { if (e.key === "Enter") $("routeShow").click(); });

// ---- Debug routes: a routing result the Worker kept for a plan made in debug mode, as a JSON file.
$("debugRoute").addEventListener("click", async (e) => {
  const b = e.target.closest("[data-part]");
  if (!b) return;
  const id = $("routeId").value.trim().replace(/^#/, "").toLowerCase();
  const msg = $("routeMsg");
  msg.classList.remove("error");
  if (!id) { msg.textContent = "Enter a route id first."; return; }
  msg.textContent = "Fetching…";
  try {
    const part = b.dataset.part;
    const res = await fetch(`${WORKER}/debug/route/${encodeURIComponent(id)}${part ? `?part=${part}` : ""}`, { headers: { "X-Access": savedToken() } });
    if (!res.ok) throw new Error((await res.json().catch(() => ({}))).error || `Error ${res.status}`);
    const text = await res.text();
    if (!part) {
      try {
        const rec = JSON.parse(text), r = rec.app?.route || {};
        msg.textContent = `${id}: planned ${new Date(rec.at).toLocaleString()} · ${r.distanceKm} km · ${(rec.app?.stations || []).length} chargers · Worker ${rec.worker} · ${Math.round(text.length / 1024)} kB`;
      } catch (_) { msg.textContent = "Downloaded."; }
    } else msg.textContent = `Downloaded (${Math.round(text.length / 1024)} kB).`;
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([text], { type: "application/json" }));
    a.download = `evailability-route-${id}${part ? `-${part}` : ""}.json`;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 10000);
  } catch (err) {
    msg.textContent = err.message;
    msg.classList.add("error");
  }
});

$("login").addEventListener("submit", (e) => { e.preventDefault(); load(); });
$("refresh").addEventListener("click", () => load(savedToken()));
$("logout").addEventListener("click", () => {
  try { localStorage.removeItem(KEY); sessionStorage.removeItem(KEY); } catch (_) {}
  $("out").innerHTML = "";
  $("settings").innerHTML = "";
  $("routeView").innerHTML = "";
  showLoggedIn(false);
  $("pw").focus();
});
const t = savedToken();
if (t) load(t);
</script>
