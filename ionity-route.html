<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ionity route">
<meta name="theme-color" content="#1d2429">
<title>Ionity route</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Overpass:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  /* Overpass descends from Highway Gothic, the lettering on motorway signs. */
  :root {
    --asphalt: #1d2429;
    --asphalt-raised: #263038;
    --line: #f3f1ea;
    --muted: #93a0a8;
    --sign-blue: #2f63b8;
    --free: #43b96d;
    --full: #f0a43a;
    --offline: #6c767d;
    --danger: #e0574f;
    --row-h: 86px;
    color-scheme: dark;
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      --asphalt: #eef1f3;
      --asphalt-raised: #ffffff;
      --line: #1b2328;
      --muted: #5c6970;
      --sign-blue: #1f55ad;
      --free: #23914b;
      --full: #c47a12;
      --offline: #7f888e;
      color-scheme: light;
    }
  }
  :root[data-theme="dark"] { color-scheme: dark; }

  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--asphalt);
    color: var(--line);
    font-family: "Overpass", "Helvetica Neue", Arial, sans-serif;
    font-variant-numeric: tabular-nums;
    -webkit-font-smoothing: antialiased;
    padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px)
             env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px);
  }
  button, input { font: inherit; color: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 3px solid var(--sign-blue); outline-offset: 2px; }
  [hidden] { display: none !important; }

  /* ---------- start screen ---------- */
  #start { max-width: 560px; margin: 0 auto; padding: 28px 20px 40px; }
  #start h1 { font-size: 2rem; font-weight: 800; margin: 0 0 4px; letter-spacing: -0.01em; }
  #start .lede { color: var(--muted); margin: 0 0 28px; line-height: 1.5; }
  label.field { display: block; font-weight: 600; margin: 18px 0 6px; }
  .input {
    width: 100%; padding: 14px 16px; font-size: 1.15rem;
    background: var(--asphalt-raised); border: 2px solid transparent; border-radius: 10px;
  }
  .input:focus { border-color: var(--sign-blue); outline: none; }
  .hint { color: var(--muted); font-size: .9rem; margin-top: 6px; }
  .results { list-style: none; margin: 6px 0 0; padding: 0; }
  .results button {
    width: 100%; text-align: left; padding: 12px 16px; border: 0; border-radius: 8px;
    background: transparent; line-height: 1.35;
  }
  .results button:hover, .results button[aria-pressed="true"] { background: var(--asphalt-raised); }
  .results button[aria-pressed="true"] { box-shadow: inset 4px 0 0 var(--sign-blue); }
  .check { display: flex; gap: 10px; align-items: center; margin: 22px 0 0; color: var(--muted); }
  .check input { width: 20px; height: 20px; accent-color: var(--sign-blue); }
  .primary {
    margin-top: 26px; width: 100%; padding: 16px; font-size: 1.2rem; font-weight: 800;
    background: var(--sign-blue); color: #fff; border: 0; border-radius: 10px;
  }
  .primary:disabled { opacity: .45; cursor: default; }
  .version { margin-top: 36px; }
  .link { background: none; border: 0; padding: 0; color: var(--muted); text-decoration: underline; font-size: inherit; }
  .error { color: var(--danger); margin-top: 14px; line-height: 1.45; }

  /* ---------- driving screen ---------- */
  #drive { height: 100%; display: flex; flex-direction: column; }
  .bar {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: 10px 16px; color: var(--muted); font-size: .95rem;
  }
  .bar button { background: none; border: 0; color: var(--muted); padding: 6px 0; font-weight: 600; }
  .bar .toggle {
    padding: 6px 12px; border-radius: 999px; border: 2px solid var(--muted); color: var(--muted); white-space: nowrap;
  }
  .bar .toggle[aria-pressed="true"] { background: var(--free); border-color: var(--free); color: #fff; }
  #age { text-align: right; }

  /* The strip: one vertical road, destination at the top, you at the bottom. */
  .strip {
    position: relative; flex: 1; min-height: 0;
    display: flex; flex-direction: column;
    padding: 0 16px 12px;
  }
  .strip::before {
    content: ""; position: absolute; left: 38px; top: 30px; bottom: 44px; width: 8px;
    background: var(--sign-blue); border-radius: 4px;
  }
  .list {
    flex: 1; min-height: 0; display: flex; flex-direction: column;
    overflow-y: auto; overscroll-behavior: contain; -webkit-overflow-scrolling: touch; scrollbar-width: none;
  }
  .list::-webkit-scrollbar { display: none; }
  .list > :first-child { margin-top: auto; } /* rows sit at the bottom, next to you */
  /* Fade at the top when there are more chargers above */
  .list.more-above { -webkit-mask-image: linear-gradient(to bottom, transparent 0, #000 56px); mask-image: linear-gradient(to bottom, transparent 0, #000 56px); }

  .row {
    position: relative; display: grid; grid-template-columns: 48px 1fr auto; align-items: center;
    column-gap: 14px; height: var(--row-h); padding: 8px 0;
  }
  .row > div { min-width: 0; }
  .marker {
    justify-self: center; width: 30px; height: 30px; border-radius: 50%;
    border: 5px solid var(--asphalt); background: var(--offline); z-index: 1;
  }
  .name { font-size: 1.35rem; font-weight: 800; line-height: 1.1; display: flex; align-items: baseline; gap: 10px; white-space: nowrap; overflow: hidden; }
  .name .label { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
  .name .detour, .name .country { flex-shrink: 0; }
  .name .stat { flex-shrink: 0; margin-left: auto; font-size: 1.3rem; font-weight: 600; color: var(--muted); }
  .name .stat strong { font-weight: 800; }
  .sub.meta { display: flex; align-items: center; gap: 10px; }
  .sub.meta > * { flex-shrink: 0; }
  .sub.meta .side { margin-right: 0; }
  .country { font-size: .85rem; font-weight: 600; color: var(--muted); }
  .detour {
    font-size: 1.05rem; font-weight: 800; padding: 1px 8px 0; border-radius: 6px;
    border: 2px solid var(--full); color: var(--full);
  }
  .side {
    margin-right: 8px; font-size: .9rem; font-weight: 800; padding: 1px 7px 0; border-radius: 6px; border: 2px solid;
  }
  .side.right { color: var(--free); border-color: var(--free); }
  .side.left { color: var(--muted); border-color: var(--muted); }
  .sub { margin-top: 4px; font-size: 1.1rem; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sub strong { font-weight: 800; }
  .dist { text-align: right; line-height: 1.05; }
  .dist .km { font-size: 1.9rem; font-weight: 800; }
  .dist .km small { font-size: 1rem; font-weight: 600; margin-left: 2px; }
  .dist .min { font-size: 1.05rem; color: var(--muted); margin-top: 2px; }

  .st.free .marker { background: var(--free); }
  .st.free .stat strong { color: var(--free); }
  .st.full .marker { background: var(--full); }
  .st.full .stat strong { color: var(--full); }
  .st.offline .marker { background: var(--offline); }
  .st.offline .name, .st.offline .dist { opacity: .55; }
  .st.stale .marker { background: var(--asphalt); border: 4px solid var(--muted); width: 26px; height: 26px; }
  .st.stale .stat, .st.stale .stat strong { color: var(--muted); font-weight: 700; }
  .row.st { cursor: pointer; -webkit-tap-highlight-color: transparent; }
  .row.st:active { opacity: .7; }
  .st.nodata .marker { background: var(--asphalt); border: 4px solid var(--muted); width: 26px; height: 26px; }

  .dest .marker {
    width: 36px; height: 36px; border-radius: 8px; background: var(--line);
    border: 5px solid var(--asphalt);
  }
  .dest .name { font-size: 1.35rem; }
  .row.dest { height: auto; min-height: var(--row-h); }
  .dest .sub { margin-top: 2px; }
  /* Appears when you've scrolled up: takes you back to the next chargers. */
  .fab {
    position: absolute; z-index: 3; left: 18px; bottom: calc(var(--row-h) + 18px);
    width: 48px; height: 48px; display: grid; place-items: center;
    border: 0; border-radius: 50%; background: var(--sign-blue); color: #fff;
    box-shadow: 0 0 0 5px var(--asphalt), 0 6px 16px rgba(0, 0, 0, .35);
  }
  .fab svg { width: 26px; height: 26px; }
  .fab:active { transform: scale(.95); }
  .you .marker {
    width: 38px; height: 38px; background: var(--line);
    clip-path: polygon(50% 0, 100% 100%, 50% 78%, 0 100%); border: 0; border-radius: 0;
  }
  .you .name { font-size: 1.2rem; }
  .you .sub { font-size: 1rem; }

  .banner {
    margin: 0 16px 12px; padding: 14px 16px; border-radius: 10px;
    background: var(--asphalt-raised); border-left: 6px solid var(--full);
    display: flex; align-items: center; justify-content: space-between; gap: 12px; font-weight: 600;
  }
  .banner button {
    background: var(--sign-blue); color: #fff; border: 0; border-radius: 8px; padding: 10px 14px; font-weight: 800;
  }
  .banner.ok { border-left-color: var(--free); }
  .sub.roads { color: var(--muted); font-weight: 600; font-size: 1rem; }
  /* Road numbers styled like that country's road signs (see roadBadge) */
  .rb {
    display: inline-block; flex-shrink: 0; padding: 2px 6px 0; border-radius: 4px;
    font-size: .85rem; font-weight: 800; line-height: 1.25; letter-spacing: .02em;
    color: #fff; background: #c4262e; box-shadow: inset 0 0 0 1.5px rgba(255,255,255,.55);
  }
  .rb.e { background: #0f7a3f; }
  .rb.n { background: #f2c200; color: #1b1b1b; box-shadow: inset 0 0 0 1.5px rgba(0,0,0,.35); }
  .rb.blue { background: #1d4fa3; color: #fff; box-shadow: inset 0 0 0 1.5px rgba(255,255,255,.7); }
  .sub.roads .rb { font-size: .9rem; margin-right: 2px; }
  .sub.roads .sep { color: var(--muted); margin: 0 3px; }
  .empty { color: var(--muted); padding: 12px 0 12px 62px; font-size: 1.1rem; line-height: 1.4; }
</style>
</head>
<body>

<section id="start">
  <h1>Ionity route</h1>
  <p class="lede">Ionity chargers along your route, with how many are free and how much of a detour each one is.</p>

  <label class="field" for="to">Destination</label>
  <input id="to" class="input" type="search" placeholder="Town or address" autocomplete="off">
  <ul id="toResults" class="results"></ul>

  <label class="field" for="via">Via (optional)</label>
  <input id="via" class="input" type="search" placeholder="A town to drive through" autocomplete="off">
  <div class="hint">Choose your own way, for example via Luxembourg instead of Brussels.</div>
  <ul id="viaResults" class="results"></ul>

  <label class="field" for="from">Start</label>
  <input id="from" class="input" type="search" placeholder="Your current location" autocomplete="off">
  <div class="hint">Leave empty to start from where you are now.</div>
  <ul id="fromResults" class="results"></ul>

  <label class="check"><input id="sim" type="checkbox"> Simulate the drive, for testing at home</label>

  <button id="planBtn" class="primary" disabled>Plan route</button>
  <p id="startError" class="error" hidden></p>
  <p class="hint version">Version <span id="version"></span> <button type="button" id="checkUpdate" class="link">Check for update</button></p>
</section>

<section id="drive" hidden>
  <div class="bar">
    <button id="newRoute">New route</button>
    <button id="mySide" class="toggle" aria-pressed="false">My side only</button>
    <span id="age"></span>
  </div>
  <div class="strip">
    <div class="row dest" id="destRow"></div>
    <button type="button" class="fab" id="more" hidden aria-label="Back to the next chargers"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 9l7 7 7-7" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    <div class="list" id="list"></div>
    <div class="row you" id="youRow"></div>
  </div>
  <div class="banner" id="offRoute" hidden role="status" aria-live="polite">
    <span id="offRouteText"></span>
    <button id="recalc" hidden>Try again</button>
  </div>
</section>

<script>
const APP_VERSION = "2026-11-14.8";
const WORKER = "https://ionity.remco-dv.workers.dev";
const STORE_KEY = "ionity-route-v1";
const STATUS_EVERY_MS = 60 * 1000;
const AUTO_STATUS = 5;              // only the next 5 chargers refresh by themselves
const STALE_MS = 3 * 60 * 1000;     // further ones turn grey after 3 minutes; tap to refresh
const STATUS_BATCH = 4; // stations per /status call (the Worker looks up at most 4 Austrian sites per call)
const PASSED_KM = 0.5;      // a station drops off once you're this far past it
const SHOW_DETOUR_FROM = 2; // minutes; less than this counts as on your route
// Every charging stop costs a little time to pull in and out (exit lane, slow road through the
// service area, merging again). That isn't a detour, so it's taken off before showing "+N".
const PULL_IN_MIN = 2;
// Only for chargers right next to the motorway (a service area). A charger beyond an exit
// (Autohof, town) costs you the exit and the way back, and that is the detour itself.
const SERVICE_AREA_KM = 0.25;
function detourOf(s) {
  if (s.detourMin == null) return null;
  // On the other side of the road it can't be a service area you pull into: either you turn
  // around (a big detour anyway) or it's at an exit reachable from both sides (e.g. Dietmannsried).
  const serviceArea = s.offRouteKm != null && s.offRouteKm <= SERVICE_AREA_KM && sideOf(s) !== "left";
  const pullIn = serviceArea ? PULL_IN_MIN : 0;
  return Math.max(0, s.detourMin - pullIn);
}
const OFF_ROUTE_KM = 1.0;
const MY_SIDE_MAX_DETOUR = 5; // minutes; stations without a side badge stay visible up to this detour
const MY_SIDE_KEY = "ionity-route-myside";

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

const state = {
  to: null, from: null, via: null, // {label, lat, lon}
  rerouting: false, lastRerouteAt: 0, bannerTimer: null,
  route: null, stations: [],      // from the Worker
  statusAt: null,
  user: { km: 0, min: 0, offKm: 0, acc: null, at: null },
  offCount: 0,
  stickToBottom: true,
  mySideOnly: localStorage.getItem(MY_SIDE_KEY) === "1",           // follow the nearest chargers unless you've scrolled up
  watchId: null, simTimer: null, statusTimer: null, wakeLock: null,
};

// ------------------------------------------------------------- API

async function api(path, body) {
  const res = await fetch(WORKER + path, body
    ? { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) }
    : {});
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || `The server answered ${res.status}`);
  return data;
}

// ------------------------------------------------------------- start screen

function debounce(fn, ms) { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; }

function wireSearch(inputId, listId, key) {
  const input = $(inputId), list = $(listId);
  const search = debounce(async () => {
    const q = input.value.trim();
    state[key] = null; updatePlanBtn();
    if (q.length < 3) { list.innerHTML = ""; return; }
    try {
      const { results } = await api(`/geocode?q=${encodeURIComponent(q)}`);
      // Europe first: the geocoder also knows the other Venlo, in North Dakota.
      const inEurope = (r) => r.lat > 34 && r.lat < 72 && r.lon > -25 && r.lon < 45;
      results.sort((a, b) => inEurope(b) - inEurope(a));
      list.innerHTML = results.map((r, i) =>
        `<li><button type="button" data-i="${i}" aria-pressed="false">${esc(r.label)}</button></li>`).join("");
      list.querySelectorAll("button").forEach((b) => b.addEventListener("click", () => {
        list.querySelectorAll("button").forEach((x) => x.setAttribute("aria-pressed", "false"));
        b.setAttribute("aria-pressed", "true");
        state[key] = results[+b.dataset.i];
        input.value = state[key].label.split(",")[0];
        updatePlanBtn();
      }));
    } catch (e) { list.innerHTML = `<li class="error">${esc(e.message)}</li>`; }
  }, 350);
  input.addEventListener("input", search);
}

function updatePlanBtn() {
  const fromOk = !$("from").value.trim() || state.from;
  const viaOk = !$("via").value.trim() || state.via;
  $("planBtn").disabled = !(state.to && fromOk && viaOk);
}

function showStartError(msg) { const p = $("startError"); p.textContent = msg; p.hidden = !msg; }

function currentPosition() {
  return new Promise((resolve, reject) => {
    if (!navigator.geolocation) return reject(new Error("This browser can’t share your location. Fill in a start instead."));
    navigator.geolocation.getCurrentPosition(
      (p) => resolve([p.coords.longitude, p.coords.latitude]),
      () => reject(new Error("Location access was refused. Allow it in your browser settings, or fill in a start.")),
      { enableHighAccuracy: true, timeout: 15000 });
  });
}

async function plan(fromLonLat) {
  const body = { from: fromLonLat, to: [state.to.lon, state.to.lat] };
  if (state.via) body.via = [state.via.lon, state.via.lat];
  const data = await api("/plan", body);
  state.route = data.route;
  state.stations = data.stations;
  for (const s of state.stations) s.statusAt = Date.now();
  state.statusAt = Date.now();
  state.user = { km: 0, min: 0, offKm: 0, acc: null, at: null };
  state.offCount = 0;
  save();
}

$("planBtn").addEventListener("click", async () => {
  const btn = $("planBtn");
  btn.disabled = true; btn.textContent = "Planning…"; showStartError("");
  try {
    const from = state.from ? [state.from.lon, state.from.lat] : await currentPosition();
    await plan(from);
    startDriving();
  } catch (e) {
    showStartError(e.message);
  } finally {
    btn.textContent = "Plan route"; updatePlanBtn();
  }
});

// ------------------------------------------------------------- geometry

const R = 6371, rad = (d) => d * Math.PI / 180;
function xy([lon, lat], refLat) { return [rad(lon) * R * Math.cos(rad(refLat)), rad(lat) * R]; }
function seg(p, a, b) {
  const dx = b[0] - a[0], dy = b[1] - a[1], l2 = dx * dx + dy * dy;
  let t = l2 ? ((p[0] - a[0]) * dx + (p[1] - a[1]) * dy) / l2 : 0;
  t = Math.max(0, Math.min(1, t));
  return { t, d: Math.hypot(p[0] - (a[0] + t * dx), p[1] - (a[1] + t * dy)) };
}

// Where you are along the route. Prefers the part of the route ahead of your last position,
// so a road that passes close to itself doesn't make you jump back.
function project(lonlat) {
  const { coords, km, min } = state.route;
  const p = xy(lonlat, lonlat[1]);
  let best = null, bestAhead = null;
  for (let i = 0; i < coords.length - 1; i++) {
    const r = seg(p, xy(coords[i], lonlat[1]), xy(coords[i + 1], lonlat[1]));
    const along = km[i] + r.t * (km[i + 1] - km[i]);
    const cand = { d: r.d, km: along, min: min[i] + r.t * (min[i + 1] - min[i]) };
    if (!best || cand.d < best.d) best = cand;
    if (along >= state.user.km - 2 && (!bestAhead || cand.d < bestAhead.d)) bestAhead = cand;
  }
  return bestAhead && bestAhead.d < 1 ? bestAhead : best;
}

function pointAtKm(k) {
  const { coords, km } = state.route;
  for (let i = 0; i < km.length - 1; i++) {
    if (km[i + 1] >= k) {
      const t = (k - km[i]) / ((km[i + 1] - km[i]) || 1);
      return [coords[i][0] + t * (coords[i + 1][0] - coords[i][0]), coords[i][1] + t * (coords[i + 1][1] - coords[i][1])];
    }
  }
  return coords[coords.length - 1];
}

// Which side of the road a station is on, seen in your driving direction.
// Only for stations close to the route (service areas); further away it's a detour either way.
const SIDE_WITHIN_KM = 0.5;
function sideOf(s) {
  if (s._side !== undefined) return s._side;
  const { coords } = state.route;
  const ref = s.lat, p = xy([s.lon, s.lat], ref);
  let best = { d: Infinity, i: 0 };
  for (let i = 0; i < coords.length - 1; i++) {
    const r = seg(p, xy(coords[i], ref), xy(coords[i + 1], ref));
    if (r.d < best.d) best = { d: r.d, i };
  }
  let side = null;
  if (best.d <= SIDE_WITHIN_KM && best.d > 0.015) { // right on the line: can't tell
    const a = xy(coords[best.i], ref), b = xy(coords[best.i + 1], ref);
    const cross = (b[0] - a[0]) * (p[1] - a[1]) - (b[1] - a[1]) * (p[0] - a[0]);
    side = cross < 0 ? "right" : "left";
  }
  s._side = side;
  return side;
}

// ------------------------------------------------------------- driving

function startDriving() {
  $("start").hidden = true;
  $("drive").hidden = false;
  stopTracking();
  if ($("sim").checked) startSimulation(); else startGps();
  state.statusTimer = setInterval(refreshStatus, STATUS_EVERY_MS);
  keepAwake();
  render();
}

function stopTracking() {
  if (state.watchId != null) navigator.geolocation.clearWatch(state.watchId);
  clearInterval(state.simTimer); clearInterval(state.statusTimer);
  state.watchId = state.simTimer = state.statusTimer = null;
}

function startGps() {
  if (!navigator.geolocation) return;
  state.watchId = navigator.geolocation.watchPosition(
    (p) => onPosition([p.coords.longitude, p.coords.latitude], p.coords.accuracy),
    () => { state.user.acc = null; render(); },
    { enableHighAccuracy: true, maximumAge: 2000, timeout: 20000 });
}

// Drives the route at 100 km/h, sped up 30 times, so a test drive takes minutes.
function startSimulation() {
  let k = 0;
  state.simTimer = setInterval(() => {
    k = Math.min(k + (100 * 30) / 3600, state.route.distanceKm);
    onPosition(pointAtKm(k), 10);
    if (k >= state.route.distanceKm) clearInterval(state.simTimer);
  }, 1000);
}

function onPosition(lonlat, accuracy) {
  const pr = project(lonlat);
  state.user = { km: pr.km, min: pr.min, offKm: pr.d, acc: accuracy, at: Date.now(), lonlat };
  const reliable = accuracy == null || accuracy < 100;
  state.offCount = reliable && pr.d > OFF_ROUTE_KM ? state.offCount + 1 : 0;
  // Once past the via point, it no longer matters for a new route.
  if (state.via && state.route.viaKm != null && pr.km > state.route.viaKm && pr.d < OFF_ROUTE_KM) {
    state.via = null; save();
  }
  if (state.offCount >= 3 && !state.rerouting && Date.now() - state.lastRerouteAt > 60000) reroute();
  render();
}

function visibleAhead() {
  const all = upcoming();
  return state.mySideOnly ? all.filter(onMySide) : all;
}

// Ask in small batches: each Worker call may only make a limited number of lookups.
async function fetchStatus(stations) {
  const list = stations.map((s) => ({ id: s.id, lat: s.lat, lon: s.lon, country: s.country }));
  const batches = [];
  for (let i = 0; i < list.length; i += STATUS_BATCH) batches.push(list.slice(i, i + STATUS_BATCH));
  const status = {};
  for (let i = 0; i < batches.length; i += 3) { // 3 batches at a time
    const res = await Promise.all(batches.slice(i, i + 3).map((b) => api("/status", { stations: b })));
    for (const r of res) Object.assign(status, r.status);
  }
  const now = Date.now();
  for (const s of state.stations) if (s.id in status) { s.status = status[s.id]; s.statusAt = now; }
}

// Tap a charger to refresh just that one.
async function refreshOne(id) {
  const s = state.stations.find((x) => x.id === id);
  if (!s || (s.loadingAt && Date.now() - s.loadingAt < 20000)) return;
  s.loadingAt = Date.now(); render();
  try { await fetchStatus([s]); } catch (e) { /* keeps the old (grey) value */ }
  s.loadingAt = null; save(); render();
}

async function refreshStatus() {
  // Only the next few chargers refresh by themselves; further ones on request.
  const ahead = visibleAhead().slice(0, AUTO_STATUS);
  if (!ahead.length) return;
  try {
    await fetchStatus(ahead);
    state.statusAt = Date.now();
    save();
    render();
  } catch (e) {
    $("age").textContent = "Couldn’t refresh charger status";
  }
}

async function keepAwake() {
  try {
    if ("wakeLock" in navigator && document.visibilityState === "visible") {
      state.wakeLock = await navigator.wakeLock.request("screen");
    }
  } catch (_) { /* not allowed right now; the screen may dim */ }
}
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible" && !$("drive").hidden) { keepAwake(); refreshStatus(); }
});

function updateScrollUi() {
  const list = $("list");
  const fromBottom = list.scrollHeight - list.scrollTop - list.clientHeight;
  state.stickToBottom = fromBottom < 24;
  $("more").hidden = state.stickToBottom;
  list.classList.toggle("more-above", list.scrollTop > 4);
}
$("list").addEventListener("scroll", updateScrollUi, { passive: true });
$("list").addEventListener("click", (e) => {
  const row = e.target.closest(".row.st[data-id]");
  if (row) refreshOne(row.dataset.id);
});
$("more").addEventListener("click", () => {
  const list = $("list");
  list.scrollTo({ top: list.scrollHeight, behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth" });
});

function syncMySide() {
  $("mySide").setAttribute("aria-pressed", String(state.mySideOnly));
}
$("mySide").addEventListener("click", () => {
  state.mySideOnly = !state.mySideOnly;
  try { localStorage.setItem(MY_SIDE_KEY, state.mySideOnly ? "1" : "0"); } catch (_) {}
  syncMySide();
  state.stickToBottom = true;
  render();
});
syncMySide();

$("newRoute").addEventListener("click", () => {
  state.stickToBottom = true;
  stopTracking();
  localStorage.removeItem(STORE_KEY);
  state.route = null; state.stations = [];
  $("drive").hidden = true; $("start").hidden = false;
  $("offRoute").hidden = true;
});

function showBanner(text, { ok = false, retry = false, hideAfter = 0 } = {}) {
  clearTimeout(state.bannerTimer);
  $("offRouteText").textContent = text;
  $("offRoute").classList.toggle("ok", ok);
  $("recalc").hidden = !retry;
  $("offRoute").hidden = false;
  if (hideAfter) state.bannerTimer = setTimeout(() => { $("offRoute").hidden = true; }, hideAfter);
}

// Road numbers look like that country's signs: motorways white on blue in Germany, Austria and
// Belgium, white on red in the Netherlands and France; national roads yellow (Austria: blue).
function roadBadge(ref, country) {
  const kind = /^E/.test(ref) ? "e" : /^[BND]\d/.test(ref) ? "n" : "m";
  const blue = (kind === "m" && ["DE", "AT", "BE", "LU", "CH"].includes(country)) || (kind === "n" && country === "AT");
  return `<span class="rb ${kind}${blue ? " blue" : ""}">${esc(ref)}</span>`;
}
const roadPartBadge = (r) => roadBadge(r.ref, r.country || countryAt(r.fromKm ?? r.toKm, r.toKm));

function roadsAhead(limit = 4) {
  const parts = (state.route?.roads || []).filter((r) => r.toKm > state.user.km + 1);
  return parts.filter((r, i) => r.ref !== parts[i - 1]?.ref).slice(0, limit);
}

// Which country a stretch of road is in, judged from the chargers on or near it.
function countryAt(fromKm, toKm) {
  const st = (state.stations || []).filter((s) => s.country);
  const inside = st.filter((s) => s.alongKm >= fromKm && s.alongKm <= toKm);
  if (inside.length) {
    const n = {};
    for (const s of inside) n[s.country] = (n[s.country] || 0) + 1;
    return Object.entries(n).sort((a, b) => b[1] - a[1])[0][0];
  }
  const mid = (fromKm + toKm) / 2;
  let best = null, gap = 60; // only trust a charger within 60 km
  for (const s of st) {
    const d = Math.min(Math.abs(s.alongKm - fromKm), Math.abs(s.alongKm - toKm), Math.abs(s.alongKm - mid));
    if (d < gap) { gap = d; best = s.country; }
  }
  return best;
}

// You've left the route: plan a new one from where you are, and say so.
async function reroute() {
  state.rerouting = true;
  state.lastRerouteAt = Date.now();
  showBanner("You’ve left the route. Rerouting…");
  try {
    const from = state.user.lonlat || await currentPosition();
    await plan(from);
    state.stickToBottom = true;
    const roads = roadsAhead();
    showBanner(roads.length ? `New route via ${roads.map((r) => r.ref).join(" › ")}` : "New route planned", { ok: true, hideAfter: 8000 });
  } catch (e) {
    showBanner(`Couldn’t reroute: ${e.message}`, { retry: true });
  } finally {
    state.rerouting = false;
    render();
  }
}
$("recalc").addEventListener("click", () => { state.lastRerouteAt = 0; reroute(); });

// ------------------------------------------------------------- rendering

function upcoming() {
  return state.stations.filter((s) => s.alongKm > state.user.km - PASSED_KM);
}

// "My side only": stations on the right, plus ones near a junction you can reach with a short detour.
function onMySide(s) {
  const side = sideOf(s);
  if (side === "right") return true;
  if (side === "left") return false;
  const dm = detourOf(s);
  return dm != null && dm <= MY_SIDE_MAX_DETOUR;
}

function fmtKm(km) { return km < 10 ? Math.max(0, km).toFixed(1) : Math.round(km); }
function fmtMin(m) {
  m = Math.max(0, Math.round(m));
  return m < 60 ? `${m} min` : `${Math.floor(m / 60)} h ${String(m % 60).padStart(2, "0")}`;
}
function clock(minFromNow) {
  return new Date(Date.now() + minFromNow * 60000).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
}
function shortName(n) {
  return String(n || "Ionity").replace(/^ionity\s+/i, "").replace(/^(Raststätte|Rastanlage|Rasthof|Autohof)\s+/i, "");
}

function statusInfo(s) {
  const st = s.status;
  // Kept short: the station name gets the room. Colour says free (green) or full (orange).
  if (!st) return { cls: "nodata", text: `<span title="${s.country === "NL" ? "Status not found" : "No live data"}">–</span>` };
  if (st.available == null) return { cls: "nodata", text: `<span title="Status unknown">?</span>` };
  if (st.state === "free") return { cls: "free", text: `<strong title="${st.available} of ${st.total} free">${st.available}/${st.total}</strong>` };
  if (st.state === "likely_offline") return { cls: "offline", text: `<strong>Offline</strong>` };
  return { cls: "full", text: `<strong title="All in use">0/${st.total}</strong>` };
}

function stationRow(s) {
  let info = statusInfo(s);
  const loading = s.loadingAt && Date.now() - s.loadingAt < 20000;
  const stale = !state.autoIds?.has(s.id) && (!s.statusAt || Date.now() - s.statusAt > STALE_MS);
  if (loading) info = { cls: "stale", text: `<span title="Updating">…</span>` };
  else if (stale) info = { cls: "stale", text: s.status ? info.text : `<span title="Tap to check">↻</span>` };
  const km = s.alongKm - state.user.km;
  const min = s.alongMin - state.user.min;
  const kw = s.status?.maxKw || s.maxKw;
  const dm = detourOf(s);
  const detour = dm != null && dm >= SHOW_DETOUR_FROM
    ? `<span class="detour" title="${dm} minutes extra">+${dm}</span>` : "";
  const country = s.road ? roadBadge(s.road, s.country)
    : s.country && s.country !== "NL" ? `<span class="country">${esc(s.country)}</span>` : "";
  const sd = sideOf(s);
  const side = sd === "right" ? `<span class="side right" title="On your side of the road">Right</span>`
    : sd === "left" ? `<span class="side left" title="On the other side of the road">Left</span>` : "";
  return `<div class="row st ${info.cls}" data-id="${esc(s.id)}" role="button" title="Tap to update this charger">
    <span class="marker" aria-hidden="true"></span>
    <div><div class="name"><span class="label">${esc(shortName(s.name))}</span><span class="stat">${info.text}</span></div>
      <div class="sub meta">${side}${detour}${country}${kw && info.cls !== "offline" ? `<span>${kw} kW</span>` : ""}</div></div>
    <div class="dist"><div class="km">${fmtKm(km)}<small>km</small></div><div class="min">${fmtMin(min)}</div></div>
  </div>`;
}

function render() {
  if (!state.route) return;
  const r = state.route, u = state.user;
  const leftKm = r.distanceKm - u.km;
  const leftMin = r.min[r.min.length - 1] - u.min;

  $("destRow").innerHTML = `<span class="marker" aria-hidden="true"></span>
    <div><div class="name">${esc(state.to?.label?.split(",")[0] || "Destination")}</div>
      <div class="sub">Arrive ${clock(leftMin)}</div>${roadsAhead().length ? `<div class="sub roads">via ${roadsAhead().map(roadPartBadge).join('<span class="sep">›</span>')}</div>` : ""}</div>
    <div class="dist"><div class="km">${fmtKm(leftKm)}<small>km</small></div><div class="min">${fmtMin(leftMin)}</div></div>`;

  const gps = u.at == null ? "Waiting for your location…"
    : u.acc != null && u.acc > 100 ? `Location rough (±${Math.round(u.acc)} m)` : "On route";
  $("youRow").innerHTML = `<span class="marker" aria-hidden="true"></span>
    <div><div class="name">You</div><div class="sub">${gps}</div></div><div></div>`;

  // Every station ahead, nearest at the bottom next to you. Scroll up to look further.
  const all = upcoming();
  const ahead = visibleAhead();
  state.autoIds = new Set(ahead.slice(0, AUTO_STATUS).map((s) => s.id));
  const hiddenCount = all.length - ahead.length;
  const list = $("list");
  const fromBottom = list.scrollHeight - list.scrollTop - list.clientHeight;
  list.innerHTML = ahead.length
    ? ahead.slice().reverse().map(stationRow).join("")
    : hiddenCount
      ? `<div class="empty">No more Ionity chargers on your side. ${hiddenCount} on the other side or further off are hidden.</div>`
      : `<div class="empty">No more Ionity chargers within 5 km of your route.</div>`;
  // Stay at the bottom, or keep your place if you've scrolled up.
  list.scrollTop = state.stickToBottom ? list.scrollHeight : list.scrollHeight - list.clientHeight - fromBottom;
  updateScrollUi();

  if (state.statusAt) {
    const ago = Math.round((Date.now() - state.statusAt) / 60000);
    $("age").textContent = ago < 1 ? "Status now" : `Status ${ago} min old`;
  }
}

window.addEventListener("resize", render);
setInterval(() => { if (!$("drive").hidden) render(); }, 30000);

// ------------------------------------------------------------- saving between visits

function save() {
  try {
    localStorage.setItem(STORE_KEY, JSON.stringify({
      to: state.to, via: state.via, route: state.route, stations: state.stations, statusAt: state.statusAt, sim: $("sim").checked,
    }));
  } catch (_) { /* storage full or blocked; the app still works */ }
}

function restore() {
  try {
    const saved = JSON.parse(localStorage.getItem(STORE_KEY) || "null");
    if (!saved?.route) return;
    Object.assign(state, { to: saved.to, via: saved.via || null, route: saved.route, stations: saved.stations, statusAt: saved.statusAt });
    $("sim").checked = !!saved.sim;
    startDriving();
    refreshStatus();
  } catch (_) { localStorage.removeItem(STORE_KEY); }
}

// ------------------------------------------------------------- updates
// A home-screen web app keeps serving its cached copy, and has no pull-to-refresh.
// So the app asks GitHub for the latest file itself, and reloads when the version changed.
// Your planned route is saved, so it comes back after the reload.
async function checkForUpdate(manual) {
  try {
    const res = await fetch(location.pathname + "?check=" + Date.now(), { cache: "no-store" });
    const latest = (await res.text()).match(/APP_VERSION = "([^"]+)"/)?.[1];
    if (latest && latest !== APP_VERSION) {
      if (sessionStorage.getItem("ionity-reloaded-for") === latest) return; // don't loop on a stale cache
      sessionStorage.setItem("ionity-reloaded-for", latest);
      location.replace(location.pathname + "?v=" + encodeURIComponent(latest));
    } else if (manual) {
      $("checkUpdate").textContent = "Up to date";
    }
  } catch (_) {
    if (manual) $("checkUpdate").textContent = "Couldn’t check, try again later";
  }
}
$("version").textContent = APP_VERSION;
$("checkUpdate").addEventListener("click", () => checkForUpdate(true));
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") checkForUpdate(false); });
checkForUpdate(false);

wireSearch("to", "toResults", "to");
wireSearch("from", "fromResults", "from");
wireSearch("via", "viaResults", "via");
restore();
</script>
</body>
</html>
