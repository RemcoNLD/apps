<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<title>Puzzzld</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=Newsreader:opsz,wght@6..72,400;6..72,600&display=swap" rel="stylesheet">
<style>
:root{
  --desk:#D7DFE7; --paper:#FBFBF7; --pencil:#30353C; --line:#2A2F35; --hatch:#C2C9D0;
  --text:#16202A; --muted:#5B6875; --panel:#F3F5F7; --panel-line:#C9D1D9;
  --btn:#FFFFFF; --btn-line:#B5C0CA; --accent:#1F4E79; --accent-text:#FFFFFF;
  --marker:#FFE45C; --marker-strong:#FFC800; --bad:#E5484D; --unk:#D9821A;
  --ui:"Bricolage Grotesque", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --serif:"Newsreader", "Iowan Old Style", Georgia, "Times New Roman", serif;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --desk:#0F1720; --paper:#E8EAE5; --hatch:#AEB6BD;
    --text:#E2E8EE; --muted:#93A1AF; --panel:#16202A; --panel-line:#2A3846;
    --btn:#1D2935; --btn-line:#34475A; --accent:#8CBBEA; --accent-text:#0D1620;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --desk:#0F1720; --paper:#E8EAE5; --hatch:#AEB6BD;
  --text:#E2E8EE; --muted:#93A1AF; --panel:#16202A; --panel-line:#2A3846;
  --btn:#1D2935; --btn-line:#34475A; --accent:#8CBBEA; --accent-text:#0D1620;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  height:100%;margin:0;display:flex;flex-direction:column;overflow:hidden;
  background:var(--desk);color:var(--text);font-family:var(--ui);
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
  -webkit-tap-highlight-color:transparent;
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--panel)}
header{
  display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;
  padding:10px 14px;background:var(--panel);border-bottom:1px solid var(--panel-line);
}
h1{margin:0;font-weight:800;font-size:24px;letter-spacing:-0.03em;line-height:1}
.grp{display:flex;gap:4px;align-items:center}
.spacer{flex:1}
button{font:inherit;color:inherit}
.ib{
  min-width:44px;height:44px;padding:0 11px;border-radius:11px;
  border:1px solid var(--btn-line);background:var(--btn);color:var(--text);
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  font:600 15px/1 var(--ui);cursor:pointer;
}
.ib svg{width:22px;height:22px;flex:none}
.ib[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-text)}
.ib:disabled{opacity:.45;cursor:default}
.ib[hidden], ol.clues li[hidden]{display:none}
.aside-opt{margin:6px 18px 0;font-size:15px;min-height:36px;color:var(--muted)}
.cost{margin:2px 18px 0;font:400 14px/1.4 var(--ui);color:var(--muted)}
body.ws #toolGum, body.ws #toolType, body.ws #undo, body.ws #check, body.ws #cluebar .ib, body.ws #banner{display:none}
body.ws #listA{display:grid;grid-template-columns:1fr 1fr}
ol.clues li.found .t{text-decoration:line-through;color:var(--muted)}
@media (prefers-reduced-motion:no-preference){ ol.clues li.justfound .t{animation:jf 1.1s ease-out} }
@keyframes jf{0%{background:var(--marker);color:#1d1c10}100%{background:transparent}}
ol.clues li.solline{grid-column:1/-1;font:400 15px/1.4 var(--ui);color:var(--muted);cursor:default}
ol.clues li.solline b{color:var(--text);letter-spacing:.08em}
.wsmiss{animation:wsmiss .5s forwards}
.swatches{display:flex;gap:10px;flex-wrap:wrap}
.sw{width:40px;height:40px;border-radius:50%;border:2px solid var(--btn-line);cursor:pointer;padding:0}
.sw[aria-pressed="true"]{outline:3px solid var(--accent);outline-offset:2px}
@keyframes wsmiss{from{opacity:.55}to{opacity:0}}
.ib:focus-visible,.wide:focus-visible,li:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--marker-strong);outline-offset:2px}
.seg{display:flex}
.seg .ib{border-radius:0}
.seg .ib:first-child{border-radius:11px 0 0 11px}
.seg .ib:last-child{border-radius:0 11px 11px 0;margin-left:-1px}
#zoomLabel{min-width:52px;text-align:center;font:600 14px var(--ui);color:var(--muted)}
#status{font:400 14px var(--ui);color:var(--text);display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--panel-line);border-radius:12px;padding:5px 6px 5px 12px;box-shadow:0 6px 18px rgba(10,20,30,.16)}
#status:empty{display:none}
#floatStatus{position:absolute;top:10px;left:12px;z-index:6;display:flex;gap:8px;align-items:center;pointer-events:none;max-width:calc(100% - 90px)}
#floatStatus > *{pointer-events:auto}
body.kbopen #floatStatus{top:72px}
#genPill[hidden]{display:none}
/* zoom buttons live on the board, like a map */
#zoomCtl{position:absolute;right:12px;bottom:84px;z-index:5;display:flex;flex-direction:column;border-radius:12px;overflow:hidden;border:1px solid var(--panel-line);background:var(--panel);box-shadow:0 6px 18px rgba(10,20,30,.16)}
.zc{width:42px;height:42px;border:0;background:none;color:var(--text);display:grid;place-items:center;cursor:pointer}
.zc + .zc{border-top:1px solid var(--panel-line)}
.zc svg{width:20px;height:20px}
.zc:focus-visible{outline:3px solid var(--marker-strong);outline-offset:-3px}
body.kbopen #zoomCtl{display:none}
/* reading your handwriting: a thin moving line under the toolbar, which never shifts anything */
header{position:relative}
body.reading header::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:3px;background:linear-gradient(90deg, transparent, var(--type), transparent) no-repeat;background-size:35% 100%;opacity:.9}
@media (prefers-reduced-motion:no-preference){ body.reading header::after{animation:readbar 1s linear infinite} }
@media (prefers-reduced-motion:reduce){ body.reading header::after{background:var(--type);opacity:.45} }
@keyframes readbar{from{background-position:-40% 0}to{background-position:140% 0}}
#status button{height:32px;padding:0 10px;border-radius:9px;border:1px solid var(--btn-line);background:var(--btn);font:600 13px var(--ui);cursor:pointer}

main{flex:1;display:flex;min-height:0}
#wrap{position:relative;flex:1;min-width:0;min-height:0}
#vp{position:absolute;inset:0;overflow:hidden;touch-action:none;cursor:crosshair;background:var(--desk);contain:strict;transform:translateZ(0);-webkit-transform:translateZ(0)}
#stage{position:absolute;left:0;top:0;transform-origin:0 0;touch-action:none;will-change:transform;-webkit-backface-visibility:hidden;backface-visibility:hidden}
#board{display:block;border-radius:2px;outline:2px solid color-mix(in srgb, var(--type) 60%, transparent)}
.stroke{fill:none;stroke:var(--pencil);stroke-width:2.1;stroke-linecap:round;stroke-linejoin:round}
.stroke.fade{transition:opacity .35s;opacity:0}
.pend{fill:var(--muted)}
@media (prefers-reduced-motion:no-preference){.pend{animation:pulse .9s ease-in-out infinite alternate}}
@keyframes pulse{from{opacity:.25}to{opacity:.9}}

#cluebar{
  position:absolute;left:12px;right:12px;bottom:12px;display:flex;align-items:center;gap:6px;
  background:var(--panel);border:1px solid var(--panel-line);border-radius:14px;padding:6px;
  box-shadow:0 6px 20px rgba(10,20,30,.18);cursor:default;
}
#cluebar .txt{flex:1;min-width:0;font:400 19px/1.3 var(--serif);padding:4px 6px;cursor:pointer}
#cluebar{z-index:5;border-left:6px solid var(--type)}
/* one colour per puzzle type, used for the type card, the clue bar, the board edge and the New tiles */
:root{--t-cross:#2F6FB3;--t-crypto:#8250C4;--t-ws:#23875A}
body{--type:var(--t-cross)}
body[data-type="crypto"]{--type:var(--t-crypto)}
body[data-type="ws"]{--type:var(--t-ws)}
#typeCard{margin:8px 14px 2px;padding:5px 10px 5px 6px;border-radius:12px;background:color-mix(in srgb, var(--type) 12%, var(--panel));border:1px solid color-mix(in srgb, var(--type) 35%, transparent);border-left:5px solid var(--type);display:flex;align-items:center;gap:8px;white-space:nowrap;overflow-x:auto;scrollbar-width:none}
#typeCard::-webkit-scrollbar{display:none}
.tc-head{display:flex;gap:7px;align-items:center;flex:none}
.tc-icon{width:24px;height:24px;border-radius:7px;background:var(--type);color:#fff;display:grid;place-items:center;flex:none}
.tc-icon svg{width:15px;height:15px}
#tcName{display:block;font:800 15px/1.2 var(--ui);letter-spacing:-0.01em;color:var(--text)}
#tcSub{display:none}
.tc-chips{display:flex;flex-wrap:nowrap;gap:5px}
.tc-chips:empty{display:none}
.chip{font:600 11.5px var(--ui);white-space:nowrap;padding:2px 8px;border-radius:999px;background:var(--panel);border:1px solid color-mix(in srgb, var(--type) 35%, var(--panel-line));color:var(--text)}
.chip.warn{border-color:var(--unk);color:var(--unk)}
h1{display:flex;align-items:center;gap:8px}
.logo{width:30px;height:30px;flex:none}
.tile[data-kind="gewoon"]{--k:var(--t-cross)}
.tile[data-kind="crypto"]{--k:var(--t-crypto)}
.tile[data-kind="ws"]{--k:var(--t-ws)}
.tile{border-left:6px solid var(--k)}
body.solved #cluebar{display:none}
#winbar{position:absolute;left:12px;right:12px;bottom:12px;z-index:5;display:flex;align-items:center;gap:10px;background:var(--marker);color:#1d1c10;border-radius:14px;padding:8px 8px 8px 16px;box-shadow:0 6px 20px rgba(10,20,30,.22);font:400 19px/1.3 var(--serif)}
#winbar[hidden]{display:none}
#winbar .wtxt{flex:1}
#winbar b{font:800 20px var(--ui);margin-right:6px}
#winbar .ib{background:#1d1c10;color:#FFE45C;border-color:#1d1c10}
.confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:30}
.wave{fill:#4CC27A;opacity:0;animation:wave 1s ease-out forwards}
@keyframes wave{0%{opacity:0}35%{opacity:.65}100%{opacity:0}}
#cluepop{position:absolute;left:12px;right:12px;bottom:76px;max-height:55%;overflow-y:auto;-webkit-overflow-scrolling:touch;background:var(--panel);border:1px solid var(--panel-line);border-radius:14px;box-shadow:0 10px 30px rgba(10,20,30,.25);padding:2px 0 10px;z-index:6}
#cluepop .hd{font:700 15px var(--ui);margin:12px 18px 2px;color:var(--muted)}
body.kbopen #cluebar{top:10px;bottom:auto}
body.kbopen #cluepop{top:72px;bottom:auto;max-height:42%}
@media (orientation:portrait), (max-width:760px){ body.kbopen aside{display:none} }
@media (max-width:700px){ body.kbopen h1, body.kbopen #openMenu, body.kbopen #openNew, body.kbopen #openLang{display:none} }
#cluebar .txt b{font:700 15px var(--ui);margin-right:8px}
.len{color:var(--muted);font-size:.85em;white-space:nowrap}

aside{
  width:340px;flex:none;background:var(--panel);border-left:1px solid var(--panel-line);
  overflow-y:auto;-webkit-overflow-scrolling:touch;padding:6px 0 28px;
}
.ptitle{display:none}
#banner{margin:10px 14px 0;padding:10px 12px;border-radius:10px;background:var(--btn);border:1px solid var(--btn-line);font:400 15px/1.4 var(--ui)}
aside h2{margin:16px 18px 4px;font:700 17px var(--ui);letter-spacing:-0.01em}
ol.clues{list-style:none;margin:0;padding:0}
ol.clues li{display:flex;gap:10px;padding:7px 18px;font:400 17px/1.38 var(--serif);cursor:pointer}
ol.clues li .n{font:700 14px/1.75 var(--ui);min-width:22px;text-align:right;color:var(--muted)}
ol.clues li.filled .t{color:var(--muted)}
ol.clues li.on{background:var(--marker);color:#1d1c10}
ol.clues li.on .n,ol.clues li.on .len,ol.clues li.on.filled .t{color:#4a4520}
@media (orientation:portrait), (max-width:760px){
  main{flex-direction:column}
  aside{width:auto;height:36%;border-left:0;border-top:1px solid var(--panel-line)}
  .lists{display:grid;grid-template-columns:1fr 1fr}
}
@media (max-width:520px){ .lists{display:block} .hide-s{display:none} }

#toast{
  position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 76px);transform:translate(-50%,-8px);
  background:var(--text);color:var(--panel);padding:12px 18px;border-radius:12px;
  font:600 16px var(--ui);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:20;max-width:90vw;text-align:center;
}
#toast.show{opacity:1;transform:translate(-50%,0)}

dialog{border:0;padding:0;border-radius:18px;background:var(--panel);color:var(--text);width:min(520px,94vw);max-height:88vh;box-shadow:0 20px 60px rgba(0,0,0,.35)}
dialog::backdrop{background:rgba(10,18,26,.45)}
.sheet{padding:18px 20px 22px;display:flex;flex-direction:column;gap:12px}
.sheet-head{display:flex;align-items:center;justify-content:space-between}
.sheet h2{margin:6px 0 0;font:800 21px var(--ui);letter-spacing:-0.02em}
.sheet h3{margin:0;font:800 17px var(--ui);letter-spacing:-0.01em}
.mgrp{border:1px solid var(--panel-line);border-radius:14px;padding:12px 14px 14px;display:flex;flex-direction:column;gap:10px}
.mgrp .sub{margin:6px 0 0;font:700 14px var(--ui);color:var(--muted)}
.mgrp .note{margin:0;font:400 14px/1.4 var(--ui);color:var(--muted)}
.mgrp .note:empty{display:none}
#claudeBox input{width:100%}
.genbtns{display:flex;flex-direction:column;gap:8px}
.genbtns .wide[hidden]{display:none}
.row[hidden], #genStatus:empty{display:none}
.kwsol{margin:8px 18px 0;padding:8px 10px;border-radius:10px;background:#D6E6F8;color:#12304F;display:flex;flex-direction:column;gap:2px}
.kwsol[hidden]{display:none}
.kwsol .lbl2{font:400 13px/1.35 var(--ui)}
.kwsol b{font:800 17px var(--ui);letter-spacing:.12em}
ol.clues li .expl{display:none;margin-top:4px;font:400 14px/1.35 var(--ui);color:var(--muted)}
ol.clues li.wordok .expl{display:block}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px}
.tile{text-align:left;padding:10px 12px;border-radius:12px;border:1px solid var(--btn-line);background:var(--btn);color:var(--text);cursor:pointer;display:flex;flex-direction:column;gap:3px}
.tile b{font:700 16px var(--ui)}
.tile span{font:400 13px/1.3 var(--ui);color:var(--muted)}
.tile[aria-pressed="true"]{border:2px solid var(--k);border-left-width:6px;padding:9px 11px;background:color-mix(in srgb, var(--k) 10%, var(--btn));box-shadow:0 0 0 3px color-mix(in srgb, var(--k) 18%, transparent)}
.tile[hidden]{display:none}
.tile:focus-visible{outline:3px solid var(--marker-strong);outline-offset:2px}
.langline{margin:0;font:400 14px var(--ui);color:var(--muted)}
.linkbtn{border:0;background:none;padding:0;color:var(--accent);font:600 14px var(--ui);text-decoration:underline;cursor:pointer}
.warn{margin:0;padding:8px 10px;border-radius:10px;background:color-mix(in srgb, var(--bad) 12%, transparent);color:var(--text);font:400 14px/1.4 var(--ui)}
.warn[hidden]{display:none}
dialog.small{width:min(440px,94vw)}
/* the dialogs keep their top edge in place, so they don't jump when their content changes height */
dialog#newDlg, dialog#menu{margin:max(6vh, calc(env(safe-area-inset-top, 0px) + 16px)) auto auto}
#langDlg .sheet{gap:14px}
#langDlg .note{margin:0;font:400 15px/1.45 var(--ui);color:var(--muted)}
#openLang span{font:700 14px var(--ui)}
#genPanel{display:flex;flex-direction:column;gap:14px;padding:6px 2px 2px}
#genPanel[hidden], #genForm[hidden]{display:none}
.gp-top{display:flex;align-items:center;gap:12px;font:700 17px/1.35 var(--ui)}
.spinner{width:22px;height:22px;flex:none;border-radius:50%;border:3px solid var(--panel-line);border-top-color:var(--accent)}
@media (prefers-reduced-motion:no-preference){ .spinner{animation:spin .9s linear infinite} }
@keyframes spin{to{transform:rotate(360deg)}}
.gbar{height:10px;border-radius:6px;background:var(--panel-line);overflow:hidden}
#genBar{height:100%;width:0;background:var(--accent);border-radius:6px;transition:width .4s ease-out}
.gbar.indet #genBar{width:30%}
@media (prefers-reduced-motion:no-preference){ .gbar.indet #genBar{animation:indet 1.4s ease-in-out infinite} }
@media (prefers-reduced-motion:reduce){ .gbar.indet #genBar{width:100%;opacity:.35} }
@keyframes indet{from{transform:translateX(-110%)}to{transform:translateX(340%)}}
.gp-meta{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font:400 14px/1.4 var(--ui);color:var(--muted)}
#genElapsed{font-variant-numeric:tabular-nums;font-weight:600;color:var(--text)}
#genPill{font:600 14px var(--ui);font-variant-numeric:tabular-nums}
#openNew{background:var(--accent);border-color:var(--accent);color:var(--accent-text)}
#newDlg .mgrp{border:0;padding:0}
@media (max-width:520px){ h1 span{display:none} }
/* keep the toolbar on one row on an iPad: drop the app name and the Settings label first */
@media (max-width:1060px){ h1 span, #openMenu .hide-s, #openLang svg{display:none} header{gap:8px;padding-left:10px;padding-right:10px} header .ib{padding:0 8px;gap:5px} }
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.lbl{font:400 15px var(--ui);color:var(--muted)}
.wide{height:48px;border-radius:12px;border:1px solid var(--btn-line);background:var(--btn);font:600 16px var(--ui);cursor:pointer;padding:0 16px}
.primary{background:var(--accent)!important;border-color:var(--accent)!important;color:var(--accent-text)!important}
.danger{color:var(--bad)}
input[type=text],select{
  height:46px;border-radius:11px;border:1px solid var(--btn-line);background:var(--btn);color:var(--text);
  font:400 16px var(--ui);padding:0 12px;-webkit-user-select:text;user-select:text;
}
input[type=text]{flex:1;min-width:180px}
.chk{display:flex;gap:12px;align-items:center;font:400 16px var(--ui);min-height:40px}
.chk input{width:22px;height:22px;accent-color:var(--accent)}
#genStatus{margin:0;font:400 15px var(--ui);color:var(--muted);min-height:1.2em}
.seg .ib + .ib{margin-left:-1px}
#kb{position:fixed;top:0;left:0;width:1px;height:1px;min-width:0;padding:0;border:0;opacity:0;font-size:16px;pointer-events:none}
</style>
</head>
<body>
<header>
  <h1><svg class="logo" viewBox="0 0 30 30" aria-hidden="true"><rect x="1" y="1" width="28" height="28" rx="7" fill="#16202A" stroke="#3A4756"/><g fill="#FFE45C"><rect x="5" y="5" width="6" height="6" rx="1.2"/><rect x="12" y="5" width="6" height="6" rx="1.2"/><rect x="19" y="5" width="6" height="6" rx="1.2"/><rect x="12" y="12" width="6" height="6" rx="1.2"/><rect x="5" y="19" width="6" height="6" rx="1.2"/><rect x="12" y="19" width="6" height="6" rx="1.2"/><rect x="19" y="19" width="6" height="6" rx="1.2"/></g><g fill="#3A4756"><rect x="5" y="12" width="6" height="6" rx="1.2"/><rect x="19" y="12" width="6" height="6" rx="1.2"/></g></svg><span data-i18n="appName">Puzzzld</span></h1>
  <div class="seg" role="group" data-i18n-aria="tools" aria-label="Gereedschap">
    <button class="ib" id="toolPen" aria-pressed="true" data-i18n-aria="pen" aria-label="Potlood">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M16.5 3.5l4 4L8 20H4v-4z"/><path d="M14 6l4 4"/></svg><span class="hide-s" data-i18n="pen">Potlood</span>
    </button>
    <button class="ib" id="toolGum" aria-pressed="false" data-i18n-aria="eraser" aria-label="Gum">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7 20h13"/><path d="M4.5 15.5l9-9a2 2 0 0 1 2.8 0l3.2 3.2a2 2 0 0 1 0 2.8L12 20H8.5l-4-4a2 2 0 0 1 0-2.8z"/><path d="M9 11l5 5"/></svg><span class="hide-s" data-i18n="eraser">Gum</span>

/* ---------- external word lists (loaded next to the app when it is hosted; unavailable inside Claude) ---------- */
const EXT = {};
async function loadWordLists(){
  for (const lang of ["nl", "en", "pt"]){
    try {
      const r = await fetch(`words/${lang}-cross.txt`, { cache:"no-cache" });
      if (!r.ok) continue;
      const txt = await r.text(), list = [];
      for (const line of txt.split("\n")){
        if (!line.trim() || line.startsWith("#")) continue;
        const [w, c, l, t] = line.split("|");
        if (!w || !c) continue;
        list.push({ w:w.trim(), c:c.trim(), l:(l || "1").trim(), t:(t || "").split(",").map(x => x.trim()).filter(Boolean) });
      }
      if (list.length > 20) EXT[lang] = list;
    } catch(_){}
  }
  if (Object.keys(EXT).length){ try { fillLevels(); } catch(_){} }
}
const RECENT_KEY = "puzzzld-recent-words";
function loadRecent(){ try { return new Set(JSON.parse(localStorage.getItem(RECENT_KEY) || "[]")); } catch(_){ return new Set(); } }
function rememberRecent(p){
  try {
    const old = JSON.parse(localStorage.getItem(RECENT_KEY) || "[]");
    const now = (p.words || []).map(x => (x.w || x.word || []).join(""));
    localStorage.setItem(RECENT_KEY, JSON.stringify(now.concat(old.filter(w => !now.includes(w))).slice(0, 500)));
  } catch(_){}
}
const capWord = w => w ? w.charAt(0).toUpperCase() + w.slice(1) : w;
function bankThemes(lang){
  const ext = EXT[lang], n = {};
  if (!ext) return [];
  for (const e of ext) for (const t of e.t) n[t] = (n[t] || 0) + 1;
  return Object.keys(n).filter(t => n[t] >= 24).sort((a, b) => a.localeCompare(b));
}
function updateBankUI(kind){
  const lang = opts.lang || "nl", row = $("#bankThemeRow"), themes = bankThemes(lang);
  if (!EXT[lang] || kind === "crypto"){ row.hidden = true; return; }
  row.hidden = !themes.length;
  const sel = $("#bankTheme"); sel.innerHTML = ""; sel.setAttribute("aria-label", tr("themeLbl"));
  const any = document.createElement("option"); any.value = ""; any.textContent = tr("themeAny"); sel.appendChild(any);
  for (const t of themes){ const o = document.createElement("option"); o.value = t; o.textContent = capWord(t); sel.appendChild(o); }
  sel.value = themes.includes(opts.bankTheme) ? opts.bankTheme : "";
  $("#genNote").textContent = tr("noteBank");
}

/* ---------------- generator ---------------- */
function tryBuild(pool, size, target, mode){
  const grid = new Map(), dirs = new Map(), placed = [];
  const b = { r0:0, r1:0, c0:0, c1:0 }; let cross = 0;
  function place(e, r, c, d){
    const dr = d === "D" ? 1 : 0, dc = d === "A" ? 1 : 0;
    for (let i = 0; i < e.w.length; i++){
      const rr = r + dr*i, cc = c + dc*i, kk = kOf(rr, cc);
      grid.set(kk, e.w[i]);
      if (!dirs.has(kk)) dirs.set(kk, new Set());
      dirs.get(kk).add(d);
      b.r0 = Math.min(b.r0, rr); b.r1 = Math.max(b.r1, rr); b.c0 = Math.min(b.c0, cc); b.c1 = Math.max(b.c1, cc);
    }
    placed.push({ word:e.w, clue:e.c, expl:e.x || "", r, c, dir:d });
  }
  function check(w, r, c, d){
    const dr = d === "D" ? 1 : 0, dc = d === "A" ? 1 : 0, n = w.length;
    if (grid.has(kOf(r - dr, c - dc)) || grid.has(kOf(r + dr*n, c + dc*n))) return -1;
    const re = r + dr*(n-1), ce = c + dc*(n-1);
    if (Math.max(b.r1, re) - Math.min(b.r0, r) + 1 > size) return -1;
    if (Math.max(b.c1, ce) - Math.min(b.c0, c) + 1 > size) return -1;
    let x = 0;
    for (let i = 0; i < n; i++){
      const rr = r + dr*i, cc = c + dc*i, kk = kOf(rr, cc), ch = grid.get(kk);
      if (ch !== undefined){ if (ch !== w[i] || dirs.get(kk).has(d)) return -1; x++; }
      else if (grid.has(kOf(rr + dc, cc + dr)) || grid.has(kOf(rr - dc, cc - dr))) return -1;
    }
    return (x === 0 || x === n) ? -1 : x;
  }
  let fi = 0;
  for (let i = 1; i < Math.min(6, pool.length); i++) if (pool[i].w.length > pool[fi].w.length) fi = i;
  const first = pool.splice(fi, 1)[0];
  place(first, 0, 0, Math.random() < .5 ? "A" : "D");
  const used = new Set([first.w]);
  for (let pass = 0; pass < 2; pass++){
    for (const e of pool){
      if (placed.length >= target) break;
      if (used.has(e.w)) continue;
      let best = null;
      for (const [kk, ch] of grid){
        const [R, C] = parseK(kk);
        for (let i = 0; i < e.w.length; i++){
          if (e.w[i] !== ch) continue;
          for (const d of ["A", "D"]){
            const r = d === "D" ? R - i : R, c = d === "A" ? C - i : C;
            const x = check(e.w, r, c, d); if (x < 0) continue;
            // kruiswoord: as many crossings and as compact as possible; cryptogram: few crossings (usually one)
            const re = r + (d === "D" ? e.w.length - 1 : 0), ce = c + (d === "A" ? e.w.length - 1 : 0);
            const grow = (Math.max(b.r1, re) - Math.min(b.r0, r) + 1) * (Math.max(b.c1, ce) - Math.min(b.c0, c) + 1) - (b.r1 - b.r0 + 1) * (b.c1 - b.c0 + 1);
            const sc = mode === "sparse" ? (x === 1 ? 12 : 4 - x) + Math.random() * 6
                                         : x * 14 - grow * 0.35 + Math.random() * 4;
            if (!best || sc > best.sc) best = { r, c, d, x, sc };
          }
        }
      }
      if (best){ place(e, best.r, best.c, best.d); used.add(e.w); cross += best.x; }
    }
  }
  const area = (b.r1 - b.r0 + 1) * (b.c1 - b.c0 + 1);
  return { placed, b, score: mode === "sparse" ? placed.length * 12 - cross * 3 : placed.length * 12 + cross * 8 - area * 0.2 };
}
function buildPuzzle(entries, size, title, mode = "dense"){
  const target = mode === "sparse" ? SIZES[size].target : Math.round(SIZES[size].target * 1.5);
  const list = entries.map(e => ({ ...e, w: tok(e.w) })).filter(e => e.w.length >= 3 && e.w.length <= size);
  let best = null;
  for (let a = 0; a < 70; a++){
    let pool = shuffle(list.slice());
    if (mode === "sparse") pool = pool.map(e => ({ e, k:e.w.length + Math.random() * 3 })).sort((x, y) => y.k - x.k).map(o => o.e);   // long words first
    const res = tryBuild(pool, size, target, mode);
    if (!best || res.score > best.score) best = res;
  }
  const { b, placed } = best;
  const h = b.r1 - b.r0 + 1, w = b.c1 - b.c0 + 1;
  const grid = Array.from({ length:h }, () => Array(w).fill(null));
  const words = placed.map(p => ({ ...p, r: p.r - b.r0, c: p.c - b.c0 }));
  const starts = new Set();
  for (const wd of words){
    starts.add(kOf(wd.r, wd.c));
    for (let i = 0; i < wd.word.length; i++){
      const r = wd.r + (wd.dir === "D" ? i : 0), c = wd.c + (wd.dir === "A" ? i : 0);
      if (!grid[r][c]) grid[r][c] = { sol: wd.word[i], num: 0 };
    }
  }
  let n = 0;
  for (let r = 0; r < h; r++) for (let c = 0; c < w; c++) if (starts.has(kOf(r, c))) grid[r][c].num = ++n;
  words.forEach(wd => { wd.num = grid[wd.r][wd.c].num; wd.id = wd.dir + wd.num; });
  words.sort((x, y) => x.dir === y.dir ? x.num - y.num : (x.dir === "A" ? -1 : 1));
  return { w, h, grid, words, title, ij: false, lang: genLang, style: mode === "sparse" ? "crypto" : "cross" };
}

function pathD(p){

  const s = Math.max(0.1, Math.min((w - 32) / W, (h - 24) / H));

    $("#genStatus").textContent = "";
    $("#genExpect").textContent = msg || "";
    $("#genCancel").textContent = tr("genCancel");
    genStart = Date.now();
    const tick = () => {
      const t = fmtTime(Date.now() - genStart);
      $("#genElapsed").textContent = tr("elapsed", t);
      const pill = $("#genPill"); pill.hidden = newDlg.open; pill.textContent = tr("genPill", t);
    };
    tick(); genTick = setInterval(tick, 500);
    genProgress({ phase:"wait" });
  } else {
    $("#genPill").hidden = true; genCtl = null;
  }
}
function genProgress({ phase, n, of }){
  const wrap = $("#genBarWrap"), bar = $("#genBar");
  wrap.classList.toggle("indet", phase === "wait");
  if (phase === "wait"){ $("#genPhase").textContent = tr("genWaiting"); bar.style.width = ""; }
  else if (phase === "write"){ $("#genPhase").textContent = tr("genWriting", n, of); bar.style.width = Math.min(95, Math.round(n / Math.max(1, of) * 95)) + "%"; }
  else { $("#genPhase").textContent = tr("genBuilding"); bar.style.width = "100%"; }
}
async function genCall(prompt, tier, expected){
  genCtl = new AbortController();
  const data = await sampleFn.json(prompt, { modelTier:tier, signal:genCtl.signal, onText:({ text }) => {
    // count the words that have come in so far, for a real progress bar
    const n = text.includes("{") ? (text.match(/"(?:woord|word)"\s*:\s*"[^"]+"/g) || []).length
                                 : (text.match(/"[^"\n]+"\s*[,\]]/g) || []).length;
    genProgress({ phase:"write", n, of:expected });
  }});
  genProgress({ phase:"build" });
  await new Promise(r => setTimeout(r, 60));
  return data;
}

/* ---------------- puzzles in English and Portuguese (made by Claude) ---------------- */
const LANG_NAME = { en:"British English", pt:"European Portuguese" };
const LEVEL_DESC_EN = {
  makkelijk:"easy, so familiar, everyday words and very clear clues",
  gemiddeld:"medium, so a mix of familiar and somewhat less familiar words with clear clues",
  moeilijk:"hard, so less common words with precise, direct clues (no wordplay)"
};
const CRYPTO_DESC_EN = {
  1:"very accessible: one simple piece of wordplay or a double meaning per clue, with everyday words, so a beginner can solve most of them",
  2:"easy: clear double meanings, simple anagrams and expressions taken literally, with familiar words",
  3:"medium: classic cryptic clues like an ordinary newspaper puzzle, with some misdirection",
  4:"hard: every clue deliberately misleads, so the obvious reading points to a wrong answer; layered wordplay, also with less common words",
  5:"very hard, for experienced solvers (the level of the toughest newspaper cryptics): no clue reads like a plain definition, the surface reading is always about something quite different from the answer, techniques are combined and unusual but real words appear"
};
const WS_WORD_LEVEL_EN = lang => ({
  makkelijk:"- Choose familiar, everyday words that everyone knows.",
  gemiddeld:"- Choose words an adult knows but rarely uses or comes across, such as old-fashioned or literary words, technical terms, and names of lesser-known animals, plants, tools, fabrics or clothing. Avoid the few thousand most common words, also for the short words. All words must really exist and be spelled correctly.",
  moeilijk:`- Very hard level, for keen puzzlers: choose words that even a well-read adult rarely or never uses, such as archaic words, technical terms from crafts, shipping, farming, music or church, and names of rare animals, plants, fabrics and tools. As an indication of the level (do not use these examples yourself): ${lang === "pt" ? "ENXÓ, ALBARDA, SOVELA, CANGALHA, ALMOTOLIA, CHARAMELA" : "HALYARD, WIMPLE, TEASEL, ADZE, SHAWM, GIMLET"}. The short words must be rare too.\n- Then check the whole list: replace every word you regularly come across in a newspaper or conversation (such as ${lang === "pt" ? "FENDA, OURIÇO or GEADA" : "CRACK, HEDGEHOG or FROST"}) with a rarer word. All words must really exist and be spelled correctly.`
});
function wsPromptOther(count, size, theme, hardWords){
  const LN = LANG_NAME[genLang] || LANG_NAME.en;
  return `Give ${count} different ${LN} words for a word search ${theme ? `on the theme: ${theme}` : hardWords ? "with no fixed theme (varied topics)" : "with no fixed theme (varied, general words)"}.
- Each word is 3 to ${size} letters long and is a single word: no spaces, hyphens or digits.${genLang === "pt" ? " Accents are allowed; they are ignored in the grid." : ""}
${theme ? themeRules(genLang) : "- At least half of the words have 3 to 5 letters; the rest may be longer."}
${WS_WORD_LEVEL_EN(genLang)[opts.wsWordLevel || "gemiddeld"]}
- Use correct ${LN} spelling.
Reply with only a JSON array of words, for example ["...","..."].`;
}
function genError(e){
  const code = e && e.code;
  $("#genStatus").textContent = code === "cancelled" ? tr("genCancelled") : code === "not_granted" ? tr("errDenied") : code === "rate_limited" ? tr("errRate") : code === "too_few" ? tr("errFew") : tr("errGen");
  if (!newDlg.open) toast($("#genStatus").textContent, 4000);   // the dialog was closed while waiting
}
async function newCrossOther(){
  const theme = $("#theme").value.trim(), kind = opts.kind || "gewoon", lvl = $("#level").value, lang = genLang;
  const LN = LANG_NAME[lang] || LANG_NAME.en;
  const themeLine = theme ? `on the theme: ${theme}` : "with no fixed theme (choose varied, general words)";
  const lenRule = `- Each word is 3 to ${opts.size} letters long and is a single word: no spaces, hyphens, digits or abbreviations.${lang === "pt" ? " Accents are allowed; they are ignored in the grid." : ""}`;
  const wordCount = kind === "crypto" ? Math.min(28, Math.ceil(SIZES[opts.size].target * 1.5)) : Math.min(44, Math.ceil(SIZES[opts.size].target * 2.2));
  let prompt, title, tier;
  if (kind === "crypto"){
    const hard = +lvl >= 4 ? `\n- Avoid clues that are just a synonym or definition, that nearly name the answer, or that can only be read one way.\n- Method: first think of many more candidates than needed and keep only the slyest ones that are still fair. Then reread every clue as an experienced solver: if the answer is obvious straight away, rewrite it until it truly misleads.${+lvl === 5 ? "\n- Prefer words of 5 letters or more." : ""}` : "";
    const style = lang === "en"
      ? "in the style of British cryptic crosswords: a definition plus wordplay (anagram, hidden word, charade, container, reversal or homophone), a double definition, or a cryptic definition"
      : "in Portuguese, using wordplay that works in Portuguese: double meanings, expressions taken literally, hidden words, anagrams or charades";
    prompt = `Create words and clues for a ${LN} cryptic crossword ${themeLine}.
Difficulty ${lvl} of 5: ${CRYPTO_DESC_EN[lvl]}.
Rules:
- Give ${wordCount} different ${LN} words.
${lenRule}
- Prefer words of 5 letters or more; compound words are welcome. Words in a cryptic cross less than in a regular crossword.
- Every clue is a creative riddle, even at level 1: never a plain definition or synonym. At low levels the riddle is easy to see through, but it stays a riddle.
- A good clue usually holds two indications that each lead to the answer, so once it clicks you can reason back how the word is built.
- For each word write a cryptic clue ${style}.${hard}
- Every clue is fair: once the penny drops, the answer fits exactly and no better word of the same length fits. Check every pair carefully.
- The word itself or a form of it does not appear in the clue. At most 12 words per clue.
- Also give a short explanation (at most 15 words) of how each clue works.
Reply with only a JSON array of objects with the fields word, clue and explanation, for example [{"word":"...","clue":"...","explanation":"..."}].`;
    title = tr("cryptoTitle", lvl, theme);
    tier = +lvl >= 4 ? "complex" : "default";
  } else {
    prompt = `Create words for a ${LN} crossword ${themeLine}.
Difficulty: ${LEVEL_DESC_EN[lvl] || LEVEL_DESC_EN.gemiddeld}.
Rules:
- Give ${wordCount} different ${LN} words${theme ? " that fit the theme" : ""}.
${lenRule}
${theme ? themeRules(lang) : "- At least half of the words have 3 to 5 letters and use common letters, so the words cross a lot."}
- Write the clues in ${LN} in the style of a classic crossword: short (1 to 4 words) and always the direct meaning of the word: a synonym or brief definition. Never a riddle, wordplay or double meaning. The word itself or a form of it does not appear in the clue.
Reply with only a JSON array of objects with the fields word and clue, for example [{"word":"...","clue":"..."}].`;
    title = theme ? tr("themeTitle", theme) : tr("claudeTitle");
    tier = "default";
  }
  setGen(true, kind === "crypto" ? tr(+lvl >= 4 ? "genCryptoSlow" : "genCryptoFast") : tr("genCross"));
  try {
    const data = await genCall(prompt, tier, wordCount);
    const arr = extractList(data);
    const seen = new Set(), entries = [];
    for (const o of arr){
      const raw = String(pick(o, ["word", "woord", "palavra"], 0));
      if (/[\s\-'’]/.test(raw.trim())) continue;
      const w = cleanWord(raw).replace(/[^A-Z]/g, ""), c = String(pick(o, ["clue", "pista", "definicao", "definição", "omschrijving"], 1)).trim(), n = tok(w).length;
      if (n < 3 || n > opts.size || !c || seen.has(w)) continue;
      seen.add(w); entries.push({ w, c, x: String(pick(o, ["explanation", "explicacao", "explicação", "uitleg"], 2)).trim() });
    }
    if (entries.length < 6) throw { code:"too_few" };
    const p = buildPuzzle(entries, opts.size, title, kind === "crypto" ? "sparse" : "dense");
    if (p.words.length < 5) throw { code:"too_few" };
    newPuzzle(p); addCost("gen", tier, estTok(prompt), estTok(JSON.stringify(data))); $("#genStatus").textContent = ""; closeNew(); toast(tr("genDone"));
  } catch (e){ genError(e); }
  finally { setGen(false); }
}
function recPrompt(n, counts){
  const head = `The image shows ${n} numbered square box${n > 1 ? "es" : ""} (1 to ${n}, left to right${n > 10 ? ", in rows of 10" : ""}).`;
  const lang = (P && P.lang) || "nl";
  const oldIJ = lang === "nl" && P && P.ij;   // only puzzles made before IJ became two squares
  const tail = `Strokes per box (dots counted separately): ${counts}. Use "?" only for a blank box or a mark that is not a letter. Reply with only a JSON array of ${n} strings in box order, e.g. ["K","${oldIJ ? "IJ" : "A"}","?"].`;
  const tips = `Only letters occur, never digits. Tips for letters that are easily confused: a Z is a top stroke, a diagonal down to the left and a bottom stroke, often written in one go and sometimes with a short bar through the middle, so a shape like a 2 or a 7 with a foot is Z, never N or S. I is one straight upright stroke, with or without serifs or a dot (a lowercase i). J has a hook at the bottom curving to the left, with or without a dot (a lowercase j). L has a foot to the right. T has a bar across the top.`;
  if (oldIJ) return `${head} Each holds one handwritten letter from a Dutch crossword, written with a stylus; it may be a capital or lowercase, and i and j may have dots. Answer with the capital letter A-Z. The Dutch letter IJ can also fill one box: answer "IJ" only when an i/I and a j/J are both clearly visible side by side in the same box. ${tips} ${tail}`;
  return `${head} Each holds one handwritten letter from ${lang === "nl" ? "a Dutch" : lang === "pt" ? "a Portuguese" : "an English"} crossword, written with a stylus; it may be a capital or lowercase, and i and j may have dots. Answer with the capital letter A-Z${lang === "pt" ? ", without accents (Ç counts as C)" : ""}. ${tips} ${tail}`;
}

/* ---------------- persistence ---------------- */
let saveT;
function save(){
  clearTimeout(saveT);

}
function load(){
  try {
    const d = JSON.parse(localStorage.getItem(STORE) || "null");
    if (d && d.P && d.P.grid && d.P.words && d.P.words.length){
      P = d.P; S = Object.assign({ strokes:{}, letters:{}, typed:{}, solved:false }, d.S || {});
      if (!S.cost) S.cost = { gen:0, rec:0, recCalls:0, tokens:0, genKnown: P.title === "Uit de woordenlijst" };   // puzzle from before cost tracking

}

/* ---------------- UI wiring ---------------- */
let lastTool = "pen";
function setTool(t){
  tool = t;
  if (t === "pen" || t === "type") lastTool = t;
  $("#toolPen").setAttribute("aria-pressed", t === "pen");
  $("#toolGum").setAttribute("aria-pressed", t === "gum");
  $("#toolType").setAttribute("aria-pressed", t === "type");
  $("#hintBtn").setAttribute("aria-pressed", t === "hint");
  vp.style.cursor = (t === "type" || t === "hint") ? "pointer" : "crosshair";
  if (t === "type") focusKb(); else kb.blur();
}
function updateHintBtn(){
  const b = $("#hintBtn"), left = hintsLeft();
  b.hidden = !opts.hints;
  b.textContent = tr("hintBtn", Math.max(0, left));
  b.disabled = (left <= 0 && tool !== "hint") || isLocked();
  if (tool === "hint" && (!opts.hints || left <= 0)) setTool(lastTool);
}
function useHint(p){
  if (isLocked()){ setTool(lastTool); return; }
  const cell = cellAt(p.x, p.y);
  if (!cell) return;                                   // tapped beside the puzzle: stay in hint mode
  const k = kOf(cell.r, cell.c);
  if (isRev(k)){ toast(tr("hintAlready")); return; }
  if (hintsLeft() <= 0){ setTool(lastTool); updateHintBtn(); return; }
  S.revealed ||= {}; S.revealed[k] = true; S.hintsUsed = (S.hintsUsed || 0) + 1;
  delete S.strokes[k]; pending.delete(k); ver[k] = (ver[k] || 0) + 1;
  S.letters[k] = P.grid[cell.r][cell.c].sol; S.typed[k] = true;
  if (marks[k]){ delete marks[k]; renderMarks(); }
  // a hint can't be undone, so drop older undo steps for this square
  history = history
    .map(h => h.items ? { ...h, items: h.items.filter(i => i.k !== k) } : h)
    .filter(h => !(h.k === k || (h.prev && h.prev.k === k) || (h.items && !h.items.length)));
  renderInk(k); renderRec(k); updateFilled();
  selectFromWriting(cell.r, cell.c);
  setTool(lastTool); updateHintBtn();
  const left = hintsLeft();
  toast(left ? tr("hintUsed", left) : tr("lastHint"));
  checkSolved(); save();
}
$("#hintBtn").onclick = () => {
  if (isWS()){ wsHint(); return; }

  toast(tr("tapForHint"));
};
