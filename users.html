<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="app-version" content="2026-11-16.1"><!-- raise with each change -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Users · EVailability</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔑</text></svg>">
<style>
  :root {
    --bg: #1d2429; --card: #263038; --text: #f3f1ea; --muted: #93a0a8; --line: #3a464f;
    --ok: #43b96d; --warn: #f0a43a; --bad: #e0574f; --blue: #2f63b8; color-scheme: dark;
  }
  @media (prefers-color-scheme: light) {
    :root { --bg: #eef1f3; --card: #fff; --text: #1b2328; --muted: #5c6970; --line: #dde3e7;
      --ok: #23914b; --warn: #c47a12; --bad: #c43d35; --blue: #1f55ad; color-scheme: light; }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html { background: var(--bg); }
  body {
    margin: 0 auto; max-width: 560px; color: var(--text); background: var(--bg);
    font: 16px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
    padding: calc(env(safe-area-inset-top, 0px) + 18px) 16px calc(env(safe-area-inset-bottom, 0px) + 28px);
    -webkit-text-size-adjust: 100%;
  }
  .back { display: inline-block; margin: 0 0 10px; font-weight: 700; text-decoration: none; color: inherit; opacity: .65; }
  h1 { font-size: 1.6rem; margin: 0 0 4px; }
  h2 { font-size: 1.15rem; margin: 24px 0 10px; }
  .muted { color: var(--muted); }
  .small { font-size: .9rem; }
  .error { color: var(--bad); }
  .row { display: flex; gap: 8px; align-items: center; }
  input[type=text], input[type=password] {
    flex: 1; min-width: 0; padding: 12px; font: inherit; color: var(--text);
    background: var(--card); border: 1px solid var(--line); border-radius: 10px;
  }
  button {
    padding: 12px 16px; font: inherit; font-weight: 700; color: #fff; background: var(--blue);
    border: 0; border-radius: 10px; cursor: pointer; min-height: 46px;
  }
  button:disabled { opacity: .5; }
  button.plain { background: transparent; color: var(--text); border: 1px solid var(--line); }
  button.danger { background: transparent; color: var(--bad); border: 1px solid var(--bad); }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
  .link { padding: 0; min-height: 0; background: none; color: var(--blue); font-weight: 600; text-decoration: underline; }
  .card { background: var(--card); border-radius: 12px; padding: 14px 16px; margin-bottom: 10px; }

  /* The new key: big, easy to read off, copy in one tap */
  .newkey { border: 2px solid var(--ok); }
  .newkey .who { font-weight: 700; }
  .newkey .key { margin: 10px 0 12px; font: 700 1.75rem/1.2 ui-monospace, "SF Mono", Menlo, monospace; letter-spacing: .06em;
    text-align: center; word-break: break-all; -webkit-user-select: all; user-select: all; }
  .newkey .acts { display: flex; gap: 8px; }
  .newkey .acts button { flex: 1; }
  .copied { background: var(--ok) !important; }

  /* User list */
  .user { padding: 0; overflow: hidden; }
  .user > button.head { all: unset; box-sizing: border-box; display: flex; width: 100%; gap: 12px; align-items: center; padding: 14px 16px; cursor: pointer; }
  .user > button.head:focus-visible { outline: 2px solid var(--blue); outline-offset: -2px; border-radius: 12px; }
  .user .main { flex: 1; min-width: 0; }
  .user .name { font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .user.off .name { color: var(--muted); text-decoration: line-through; }
  .user .meta { font-size: .88rem; color: var(--muted); }
  .chip { flex: none; font-size: .78rem; font-weight: 700; padding: 3px 9px; border-radius: 999px; background: var(--line); color: var(--muted); }
  .chip.on { background: color-mix(in srgb, var(--ok) 22%, transparent); color: var(--ok); }
  .spark { flex: none; display: flex; align-items: flex-end; gap: 2px; height: 26px; width: 56px; }
  .spark span { flex: 1; background: var(--muted); opacity: .5; border-radius: 2px 2px 0 0; min-height: 2px; }
  .spark span:last-child { background: var(--ok); opacity: 1; }
  .user .more { padding: 0 16px 14px; border-top: 1px solid var(--line); }
  .user .facts { display: grid; grid-template-columns: max-content 1fr; gap: 3px 14px; margin: 12px 0; font-size: .92rem; }
  .user .facts > :nth-child(odd) { color: var(--muted); }
  .user .btns { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .user .confirm { margin-top: 10px; padding: 10px 12px; border-radius: 10px; background: color-mix(in srgb, var(--bad) 12%, transparent); }
  .user .confirm .row { margin-top: 8px; }
  .user .confirm button { flex: 1; }
  .rename { margin-top: 8px; }

  .switch { position: relative; width: 52px; height: 30px; flex: none; }
  .switch input { position: absolute; opacity: 0; width: 100%; height: 100%; margin: 0; cursor: pointer; z-index: 1; }
  .switch span { position: absolute; inset: 0; border-radius: 15px; background: var(--line); transition: background .15s; }
  .switch span::after { content: ""; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%; background: #fff; transition: transform .15s; }
  .switch input:checked + span { background: var(--ok); }
  .switch input:checked + span::after { transform: translateX(22px); }
  .switch input:focus-visible + span { outline: 2px solid var(--blue); outline-offset: 2px; }
  @media (prefers-reduced-motion: reduce) { .switch span, .switch span::after { transition: none; } }
</style>
</head>
<body>
<a class="back" href="admin.html">‹ Usage</a>
<h1>Users</h1>
<p class="muted">Personal access keys for EVailability. A key is shown once, when it’s made.</p>

<form id="login" hidden>
  <div class="row">
    <input id="pw" type="password" placeholder="Admin password" autocomplete="current-password" aria-label="Admin password">
    <button type="submit">Open</button>
  </div>
</form>
<p id="msg" class="error" hidden></p>

<div id="app" hidden>
  <form id="create" class="row" autocomplete="off">
    <input id="label" type="text" placeholder="Name of the person" aria-label="Name of the person" maxlength="60" autocapitalize="words">
    <button type="submit" id="createBtn">Make key</button>
  </form>
  <div id="newKey"></div>
  <h2 id="listTitle">Keys</h2>
  <div id="list"><p class="muted">Loading…</p></div>
  <div id="legacy"></div>
  <p class="small muted">Switching a key off or replacing it takes effect within about two minutes. The bars show requests per day over the last 7 days.</p>
</div>

<script>
const WORKER = "https://ionity.remco-dv.workers.dev"; // same as admin.html
const KEY = "evailability-admin-token"; // shared with admin.html (same site)
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const token = () => { try { return localStorage.getItem(KEY) || sessionStorage.getItem(KEY) || ""; } catch (_) { return ""; } };
const day = (iso) => iso ? new Date(iso).toLocaleDateString("en-GB", { day: "numeric", month: "short", year: "numeric" }) : "–";
function ago(iso) {
  if (!iso) return "never";
  const min = Math.round((Date.now() - Date.parse(iso)) / 60000);
  if (min < 2) return "just now";
  if (min < 60) return `${min} min ago`;
  if (min < 48 * 60) return `${Math.round(min / 60)} h ago`;
  return day(iso);
}

let data = null, open = null, confirming = null, renaming = null;

async function api(path, body) {
  const res = await fetch(WORKER + path, body
    ? { method: "POST", headers: { Authorization: `Bearer ${token()}`, "Content-Type": "application/json" }, body: JSON.stringify(body) }
    : { headers: { Authorization: `Bearer ${token()}` } });
  const out = await res.json().catch(() => ({}));
  if (res.status === 401) { try { localStorage.removeItem(KEY); sessionStorage.removeItem(KEY); } catch (_) {} showLogin(); }
  if (!res.ok) throw new Error(out.error || `Error ${res.status}`);
  return out;
}
function showError(e) { $("msg").textContent = e?.message || String(e); $("msg").hidden = false; }
function showLogin() { $("login").hidden = false; $("app").hidden = true; $("pw").focus(); }

async function load() {
  $("msg").hidden = true;
  try {
    data = await api("/admin/users");
    $("login").hidden = true; $("app").hidden = false;
    render();
  } catch (e) { showError(e); }
}

function spark(perDay) {
  const max = Math.max(1, ...perDay);
  return `<div class="spark" aria-hidden="true">${perDay.map((n) => `<span style="height:${Math.max(8, (n / max) * 100)}%;${n ? "" : "opacity:.15"}"></span>`).join("")}</div>`;
}
function render() {
  const users = [...data.users].sort((a, b) => (b.active - a.active) || a.label.localeCompare(b.label));
  $("listTitle").textContent = users.length ? `Keys (${users.length})` : "Keys";
  $("list").innerHTML = users.length ? users.map((u) => {
    const isOpen = open === u.id;
    const week = u.perDay.reduce((a, b) => a + b, 0);
    return `<div class="card user${u.active ? "" : " off"}" data-id="${u.id}">
      <button type="button" class="head" aria-expanded="${isOpen}">
        <div class="main">
          <div class="name">${esc(u.label)}</div>
          <div class="meta">Key from ${day(u.keyMade)} · used ${ago(u.lastUsed)}</div>
        </div>
        ${spark(u.perDay)}
        <span class="chip${u.active ? " on" : ""}">${u.active ? "On" : "Off"}</span>
      </button>
      ${isOpen ? `<div class="more">
        <div class="facts">
          <span>Added</span><span>${day(u.created)}</span>
          <span>Current key</span><span>${day(u.keyMade)}${u.gen > 1 ? ` (key ${u.gen})` : ""}</span>
          <span>Last used</span><span>${u.lastUsed ? new Date(u.lastUsed).toLocaleString("en-GB", { dateStyle: "medium", timeStyle: "short" }) : "never"}</span>
          <span>Requests</span><span>${u.perDay.at(-1)} today, ${week} in 7 days</span>
        </div>
        ${renaming === u.id ? `<form class="row rename" data-act="rename-save">
            <input type="text" id="renameInput" value="${esc(u.label)}" maxlength="60" aria-label="New name">
            <button type="submit">Save</button></form>`
        : confirming?.id === u.id ? `<div class="confirm">
            <b>${confirming.act === "delete" ? `Delete ${esc(u.label)}?` : `Make a new key for ${esc(u.label)}?`}</b>
            <div class="small">${confirming.act === "delete" ? "Their devices are signed out and the key can’t be brought back." : "The current key stops working; their devices ask for the new one."}</div>
            <div class="row"><button type="button" class="plain" data-act="cancel">Cancel</button>
            <button type="button" class="${confirming.act === "delete" ? "danger" : ""}" data-act="${confirming.act}-yes">${confirming.act === "delete" ? "Delete" : "Make new key"}</button></div>
          </div>`
        : `<div class="btns">
            <button type="button" class="plain" data-act="${u.active ? "disable" : "enable"}">${u.active ? "Switch off" : "Switch on"}</button>
            <button type="button" class="plain" data-act="regenerate">New key</button>
            <button type="button" class="plain" data-act="rename">Rename</button>
            <button type="button" class="danger" data-act="delete">Delete</button>
          </div>`}
      </div>` : ""}
    </div>`;
  }).join("") : `<div class="card muted">No keys yet. Type a name above and tap Make key.</div>`;

  const legacyUse = data.legacyPerDay.reduce((a, b) => a + b, 0);
  $("legacy").innerHTML = `<h2>Old shared code</h2>
    <div class="card"><div class="row" style="justify-content:space-between">
      <div><b>11-proef code</b><div class="small muted">${data.legacyCode ? "Still opens the app." : "Switched off: those devices ask for a key."}
        ${legacyUse ? `${data.legacyPerDay.at(-1)} requests today, ${legacyUse} in 7 days.` : "Not used in 7 days."}</div></div>
      <label class="switch"><input type="checkbox" id="legacySw" ${data.legacyCode ? "checked" : ""} aria-label="Old shared code works"><span></span></label>
    </div></div>`;
  if (renaming) setTimeout(() => $("renameInput")?.focus(), 0);
}

function showKey(label, key, isNew) {
  $("newKey").innerHTML = `<div class="card newkey" role="status">
    <div class="who">${isNew ? "Key for" : "New key for"} ${esc(label)}</div>
    <div class="key" id="keyText">${esc(key)}</div>
    <div class="acts">
      <button type="button" id="copyBtn">Copy key</button>
      ${navigator.share ? `<button type="button" class="plain" id="shareBtn">Share…</button>` : ""}
    </div>
    <p class="small muted" style="margin:10px 0 0">Only shown now. Copy it before you leave this page.
      <button type="button" class="link" id="doneBtn">Done</button></p>
  </div>`;
  $("copyBtn").onclick = async () => {
    try { await navigator.clipboard.writeText(key); }
    catch (_) { // older browsers: select the text so it can be copied by hand
      const r = document.createRange(); r.selectNodeContents($("keyText"));
      const s = getSelection(); s.removeAllRanges(); s.addRange(r); return;
    }
    $("copyBtn").textContent = "Copied"; $("copyBtn").classList.add("copied");
    setTimeout(() => { if ($("copyBtn")) { $("copyBtn").textContent = "Copy key"; $("copyBtn").classList.remove("copied"); } }, 2500);
  };
  if ($("shareBtn")) $("shareBtn").onclick = () => navigator.share({
    text: `Your EVailability access key: ${key}\nOpen https://remconld.github.io/apps/evailability.html and enter it once.`,
  }).catch(() => {});
  $("doneBtn").onclick = () => { $("newKey").innerHTML = ""; };
  $("newKey").scrollIntoView({ behavior: "smooth", block: "nearest" });
}

$("login").addEventListener("submit", (e) => {
  e.preventDefault();
  const pw = $("pw").value.trim();
  if (!pw) return;
  try { localStorage.setItem(KEY, pw); } catch (_) {}
  $("pw").value = "";
  load();
});

$("create").addEventListener("submit", async (e) => {
  e.preventDefault();
  const label = $("label").value.trim();
  if (!label) { $("label").focus(); return; }
  $("createBtn").disabled = true;
  try {
    const out = await api("/admin/users", { action: "create", label });
    $("label").value = "";
    showKey(out.user.label, out.key, true);
    await load();
  } catch (err) { showError(err); }
  finally { $("createBtn").disabled = false; }
});

$("list").addEventListener("click", async (e) => {
  const card = e.target.closest(".user");
  if (!card) return;
  const id = card.dataset.id;
  const u = data.users.find((x) => x.id === id);
  if (e.target.closest("button.head")) {
    open = open === id ? null : id; confirming = null; renaming = null;
    return render();
  }
  const act = e.target.closest("[data-act]")?.dataset.act;
  if (!act || e.target.closest("form")) return;
  if (act === "cancel") { confirming = null; return render(); }
  if (act === "delete" || act === "regenerate") { confirming = { id, act }; return render(); }
  if (act === "rename") { renaming = id; return render(); }
  const action = act.replace(/-yes$/, "");
  const btn = e.target.closest("button"); btn.disabled = true;
  try {
    const out = await api("/admin/users", { action, id });
    confirming = null;
    if (action === "delete") open = null;
    if (action === "regenerate") showKey(u.label, out.key, false);
    await load();
  } catch (err) { showError(err); btn.disabled = false; }
});
$("list").addEventListener("submit", async (e) => {
  e.preventDefault();
  const id = e.target.closest(".user").dataset.id;
  const label = $("renameInput").value.trim();
  if (!label) return;
  try { await api("/admin/users", { action: "rename", id, label }); renaming = null; await load(); }
  catch (err) { showError(err); }
});
$("legacy").addEventListener("change", async (e) => {
  if (e.target.id !== "legacySw") return;
  e.target.disabled = true;
  try { await api("/admin/settings", { settings: { legacyCode: e.target.checked } }); await load(); }
  catch (err) { showError(err); e.target.checked = !e.target.checked; e.target.disabled = false; }
});

if (token()) load(); else showLogin();
</script>
</body>
</html>
