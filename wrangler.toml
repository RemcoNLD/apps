# Cloudflare Worker "ionity" (proxy for ionity-route.html).
# Deployed by .github/workflows/deploy-worker.yml. Secrets (API keys) live in Cloudflare only.
name = "ionity"
main = "src/ionity-route-worker.js"
compatibility_date = "2025-09-01"
workers_dev = true
keep_vars = true

# Usage counts for admin.html (KV namespace "ionity-usage")
[[kv_namespaces]]
binding = "USAGE"
id = "b52b6fe114a244a3a87f3a5cb5db3c73"
